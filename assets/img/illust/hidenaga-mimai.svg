<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="病の弟を見舞う兄のイメージイラスト（夜の座敷で、床に伏す人のそばに座る人）">
  <defs>
    <radialGradient id="glow" cx="0.2" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#f6dfb0"/>
      <stop offset="1" stop-color="#e9e1d2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9cfbf"/>
      <stop offset="1" stop-color="#efe9dc"/>
    </linearGradient>
  </defs>

  <!-- wall -->
  <rect width="800" height="450" fill="url(#wall)"/>
  <!-- shoji with moon light -->
  <g>
    <rect x="520" y="40" width="240" height="250" fill="#f4f1ea"/>
    <circle cx="660" cy="120" r="34" fill="#e8dcc0" opacity="0.8"/>
    <g stroke="#8a7a62" stroke-width="3">
      <path d="M520,40 H760 V290 H520 Z" fill="none" stroke-width="6"/>
      <path d="M580,40 V290 M640,40 V290 M700,40 V290"/>
      <path d="M520,90 H760 M520,140 H760 M520,190 H760 M520,240 H760"/>
    </g>
  </g>
  <!-- lintel -->
  <rect x="0" y="28" width="800" height="12" fill="#6b5a46"/>
  <!-- warm lamp light -->
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- tatami -->
  <rect y="300" width="800" height="150" fill="#cdbf98"/>
  <g stroke="#a8996e" stroke-width="2">
    <path d="M0,300 H800"/>
    <path d="M0,370 H800"/>
    <path d="M260,300 L230,450 M560,300 L600,450"/>
  </g>
  <rect y="296" width="800" height="6" fill="#6b5a46"/>

  <!-- andon lamp -->
  <g>
    <rect x="70" y="240" width="8" height="90" fill="#4f4940"/>
    <rect x="52" y="200" width="44" height="64" rx="3" fill="#f6dfb0" stroke="#6b5a46" stroke-width="3"/>
    <path d="M52,232 H96" stroke="#6b5a46" stroke-width="1.5"/>
    <rect x="56" y="326" width="36" height="8" fill="#4f4940"/>
  </g>

  <!-- futon -->
  <g>
    <rect x="360" y="318" width="360" height="40" rx="8" fill="#e6dcc8" stroke="#a8996e" stroke-width="2"/>
    <rect x="368" y="306" width="54" height="22" rx="10" fill="#b8a888"/>
    <!-- head -->
    <circle cx="400" cy="300" r="17" fill="#23201c"/>
    <!-- cover -->
    <path d="M418,322 Q440,290 520,292 Q610,288 700,304 L712,336 Q560,346 418,340 Z" fill="#7f9aa4"/>
    <path d="M418,322 Q440,290 520,292 Q610,288 700,304" fill="none" stroke="#5b7480" stroke-width="2"/>
  </g>

  <!-- the brother, kneeling, leaning toward the bed -->
  <g fill="#23201c">
    <!-- hakama -->
    <path d="M168,350 Q160,300 196,284 L262,284 Q292,300 290,350 Z"/>
    <!-- torso, leaning -->
    <path d="M200,288 L268,288 L276,222 L222,214 Z"/>
    <!-- kataginu shoulders -->
    <path d="M196,222 L298,228 L282,244 L212,240 Z"/>
    <!-- head + topknot -->
    <circle cx="258" cy="194" r="19"/>
    <rect x="252" y="168" width="12" height="9" rx="3"/>
  </g>
  <!-- arm reaching to the bed -->
  <path d="M280,236 Q320,262 352,300" stroke="#23201c" stroke-width="15" stroke-linecap="round" fill="none"/>
</svg>
