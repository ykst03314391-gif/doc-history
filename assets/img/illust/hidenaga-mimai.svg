<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="病の弟を見舞う兄のイメージイラスト（行灯の灯る座敷で、布団に伏す弟の枕元に兄が座り、手を伸ばしている）">
  <defs>
    <symbol id="sz" viewBox="-70 -150 140 150" overflow="visible">
      <path d="M-36,-52 L36,-52 L62,0 L-62,0 Z" fill="currentColor" fill-opacity="0.8" stroke="#23201c" stroke-width="2"/>
      <path d="M-24,-100 L24,-100 L28,-50 L-28,-50 Z" fill="#efe9dc" stroke="#23201c" stroke-width="2"/>
      <path d="M-50,-100 L50,-100 L42,-88 L22,-88 L17,-52 L-17,-52 L-22,-88 L-42,-88 Z" fill="currentColor" stroke="#23201c" stroke-width="2"/>
      <path d="M-9,-100 L0,-82 L9,-100 Z" fill="#f4f1ea" stroke="#23201c" stroke-width="1.5"/>
      <circle cx="0" cy="-121" r="19" fill="#ecdcc2" stroke="#23201c" stroke-width="2"/>
      <path d="M-18,-127 A19,19 0 0 1 18,-127 Q0,-119 -18,-127 Z" fill="#23201c"/>
      <path d="M-3,-139 L-3,-148 L13,-145 L13,-141 Z" fill="#23201c"/>
    </symbol>
  </defs>
  <rect width="800" height="450" fill="#fbfaf6"/>
  <rect x="0" y="340" width="800" height="110" fill="#efe9dc"/>
  <path d="M0,340 H800 M200,340 L170,450 M600,340 L630,450" stroke="#d9d2c5" stroke-width="2"/>

  <!-- 障子と月 -->
  <rect x="560" y="70" width="190" height="230" fill="#f4f1ea" stroke="#8a7a62" stroke-width="3"/>
  <circle cx="680" cy="125" r="26" fill="#efe2b8"/>
  <path d="M607,70 V300 M655,70 V300 M703,70 V300 M560,116 H750 M560,162 H750 M560,208 H750 M560,254 H750" stroke="#b8ab95" stroke-width="2"/>

  <!-- 行灯 -->
  <circle cx="100" cy="270" r="70" fill="#f6dfb0" opacity="0.5"/>
  <rect x="76" y="232" width="48" height="76" fill="#f6dfb0" stroke="#6b5a46" stroke-width="2"/>
  <path d="M76,232 H124 M100,232 V308" stroke="#6b5a46" stroke-width="1.5"/>
  <path d="M80,308 L76,350 M120,308 L124,350" stroke="#6b5a46" stroke-width="3"/>

  <!-- 布団の弟 -->
  <rect x="370" y="334" width="330" height="36" rx="8" fill="#efe9dc" stroke="#23201c" stroke-width="2"/>
  <ellipse cx="404" cy="330" rx="26" ry="11" fill="#fbfaf6" stroke="#23201c" stroke-width="1.5"/>
  <circle cx="410" cy="312" r="19" fill="#ecdcc2" stroke="#23201c" stroke-width="2"/>
  <path d="M396,300 A19,19 0 0 0 393,322 Q404,310 396,300 Z" fill="#23201c"/>
  <path d="M392,306 L380,300 L382,295 L394,301 Z" fill="#23201c"/>
  <path d="M428,316 Q432,296 470,296 L668,300 Q690,302 690,324 L690,338 L426,338 Z" fill="#2f5d7c" fill-opacity="0.85" stroke="#23201c" stroke-width="2"/>
  <path d="M470,312 Q560,306 670,314" stroke="#23201c" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- 枕元の兄 -->
  <use href="#sz" x="176" y="200" width="168" height="180" color="#9b2d20"/>
  <path d="M314,262 L364,288 L356,304 L306,282 Z" fill="#9b2d20" stroke="#23201c" stroke-width="2"/>
  <circle cx="366" cy="298" r="9" fill="#ecdcc2" stroke="#23201c" stroke-width="2"/>

  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif" text-anchor="middle">
    <text x="330" y="70" font-size="18" fill="#4f4940">天正18年（1590）10月、郡山</text>
    <text x="260" y="415" font-size="20" font-weight="700" fill="#9b2d20">兄・秀吉</text>
    <text x="540" y="415" font-size="20" font-weight="700" fill="#2f5d7c">弟・秀長</text>
  </g>
</svg>
