<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="病の弟を見舞う兄の想像図（行灯の灯る座敷で、折烏帽子をかぶり首に小豆を下げて掛け布団にくるまり、額に手ぬぐいをのせて伏す四つ足の弟の猫（布団の端からしっぽが立つ）の枕元に、高い烏帽子をかぶり首に瓢箪を下げた四つ足の兄の猫が寄り、心配そうに前足を弟の頭へ伸ばしている）（兄は涙ぐんだ悲しい顔、弟は弱った顔）">
  <defs>
    <!-- 表情（眉なし。目と口だけを描き替える。見本は chara/papaneko-hyojo.svg）。頭の座標で重ねる -->
    <g id="pn-ex-cover"><path d="M-47,-24 H47 V40 H-47 Z" fill="#fbfaf6" stroke="none"/><ellipse cx="0" cy="9" rx="5" ry="4" fill="none" stroke="#23201c" stroke-width="2"/></g>
    <g id="pn-ex-ki" fill="none" stroke="#23201c" stroke-linecap="round" stroke-linejoin="round"><use href="#pn-ex-cover"/><path d="M-44,0 Q-29,-20 -14,0 M14,0 Q29,-20 44,0" stroke-width="3"/><path d="M-16,17 Q-8,27 0,14 Q8,27 16,17" stroke-width="2"/><path d="M-9,23 Q0,42 9,23 Q0,27 -9,23 Z" fill="#23201c" stroke-width="1.5"/><path d="M-64,24 l6,-8 M-56,24 l6,-8 M-48,24 l6,-8 M42,24 l6,-8 M50,24 l6,-8 M58,24 l6,-8" stroke-width="1.5"/></g>
    <g id="pn-ex-do" fill="none" stroke="#23201c" stroke-linecap="round"><use href="#pn-ex-cover"/><path d="M-42,-12 L-17,-2 M17,-2 L42,-12" stroke-width="3"/><path d="M-16,28 Q-8,15 0,27 Q8,15 16,28" stroke-width="2"/></g>
    <g id="pn-ex-ai" fill="none" stroke="#23201c" stroke-linecap="round"><use href="#pn-ex-cover"/><path d="M-42,0 L-18,-9 M18,-9 L42,0" stroke-width="2.5"/><path d="M-11,27 Q-5,19 0,25 Q5,19 11,27" stroke-width="2"/></g>
    <g id="pn-ex-namida"><path d="M-34,6 Q-41,18 -34,22 Q-27,18 -34,6 Z" fill="#dfe9f0" stroke="#2f5d7c" stroke-width="2"/></g>
    <g id="pn-ex-raku" fill="none" stroke="#23201c" stroke-linecap="round"><use href="#pn-ex-cover"/><path d="M-40,-8 Q-28,2 -16,-8 M16,-8 Q28,2 40,-8" stroke-width="2.5"/><path d="M-16,17 Q-8,29 0,14 Q8,29 16,17" stroke-width="2"/><path d="M-62,24 l6,-8 M-54,24 l6,-8 M48,24 l6,-8 M56,24 l6,-8" stroke-width="1.5"/></g>
    <!-- ぱぱねこの頭（中心 0,0。顔の決まりは chara/README.md） -->
    <g id="pn-head">
      <circle cx="-45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <circle cx="45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-78,10 C-80,-30 -50,-47 0,-47 C50,-47 80,-30 78,10 C78,40 50,52 0,52 C-50,52 -78,40 -78,10 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-40,-3 Q-28,-15 -16,-3 M16,-3 Q28,-15 40,-3" fill="none" stroke="#23201c" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="9" rx="5" ry="4" fill="none" stroke="#23201c" stroke-width="2"/>
      <path d="M-16,17 Q-8,29 0,14 Q8,29 16,17" fill="none" stroke="#23201c" stroke-width="2" stroke-linecap="round"/>
      <path d="M-50,10 L-92,5 M-50,18 L-94,19 M-48,26 L-90,33 M50,10 L92,5 M50,18 L94,19 M48,26 L90,33" stroke="#23201c" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="800" height="450" fill="#fbfaf6"/>
  <rect x="0" y="340" width="800" height="110" fill="#efe9dc"/>
  <path d="M0,340 H800 M200,340 L170,450 M600,340 L630,450" stroke="#d9d2c5" stroke-width="2"/>

  <!-- 障子と月 -->
  <rect x="380" y="60" width="190" height="170" fill="#f4f1ea" stroke="#8a7a62" stroke-width="3"/>
  <circle cx="500" cy="110" r="26" fill="#efe2b8"/>
  <path d="M427,60 V230 M475,60 V230 M523,60 V230 M380,103 H570 M380,146 H570 M380,189 H570" stroke="#b8ab95" stroke-width="2"/>

  <!-- 行灯 -->
  <circle cx="90" cy="270" r="70" fill="#f6dfb0" opacity="0.5"/>
  <rect x="66" y="232" width="48" height="76" fill="#f6dfb0" stroke="#6b5a46" stroke-width="2"/>
  <path d="M66,232 H114 M90,232 V308" stroke="#6b5a46" stroke-width="1.5"/>
  <path d="M70,308 L66,350 M110,308 L114,350" stroke="#6b5a46" stroke-width="3"/>

  <!-- 布団の弟 -->
  <ellipse cx="555" cy="334" rx="48" ry="12" fill="#efe9dc" stroke="#23201c" stroke-width="2"/>
  <g transform="translate(565,292) rotate(-14) scale(0.72)">
    <use href="#pn-head"/><use href="#pn-ex-ai"/>
    <!-- 低い折烏帽子（秀長の印。先を後ろへ折る） -->
    <path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/>
    <!-- 首に下げた小豆（大納言小豆。秀長の印） -->
    <path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 額の手ぬぐい -->
    <rect x="-30" y="-50" width="60" height="18" rx="3" fill="#fff" stroke="#23201c" stroke-width="2.5"/>
    <path d="M-20,-50 V-32 M0,-50 V-32 M20,-50 V-32" stroke="#2f5d7c" stroke-width="2" opacity="0.6"/>
  </g>
  <path d="M623,262 q-6,10 0,14 q6,-4 0,-14 Z" fill="#cfe0ec" stroke="#2f5d7c" stroke-width="1.2"/>
  <!-- 掛け布団の下の弟（基本形の四つ足。服は着せず、低い折烏帽子で見分ける。前足と、布団の端から立つしっぽ） -->
  <path d="M764,308 Q772,296 772,280 Q774,264 786,264 Q796,266 794,280 L790,308 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M610,310 Q614,292 650,292 L766,298 Q788,300 788,322 L788,340 L606,340 Z" fill="#2f5d7c" fill-opacity="0.85" stroke="#23201c" stroke-width="2"/>
  <path d="M652,312 Q710,304 776,314" stroke="#23201c" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M640,312 L614,322" stroke="#23201c" stroke-width="17" stroke-linecap="round"/>
  <path d="M640,312 L614,322" stroke="#fbfaf6" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="604" cy="326" rx="12" ry="7" fill="#fbfaf6" stroke="#23201c" stroke-width="2"/>

  <!-- 枕元の兄（基本形の四つ足のぱぱねこ。服は着せず、高い立烏帽子で見分ける。前足を弟へ伸ばす） -->
  <g transform="translate(477.2,21.6) scale(-0.8,0.8)">
    <path d="M-104,-92 C-110,-70 -116,-40 -112,-26 Q-108,-19 -100,-19 L-62,-19 L-62,-10 Q-62,0 -55,0 Q-48,0 -48,-10 L-48,-19 L14,-19 L14,-10 Q14,0 21,0 Q28,0 28,-10 L28,-19 L60,-19 L60,-10 Q60,0 67,0 Q74,0 74,-10 L74,-19 Q90,-21 93,-38 L94,-66 Q90,-74 94,-82 L96,-112 Q97,-134 84,-135 Q73,-135 67,-120 Q61,-100 50,-87 Q40,-89 20,-88 L-104,-92 Z" transform="translate(235,398)" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M173,379 L173,388 Q173,398 180,398 Q187,398 187,388 L187,379 M249,379 L249,388 Q249,398 256,398 Q263,398 263,388 L263,379 M295,379 L295,388 Q295,398 302,398 Q309,398 309,388 L309,379" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M334,320 Q340,300 338,290 Q338,280 346,280 L354,280 Q362,280 362,290 Q362,318 350,332 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <path d="M372,302 L496,268" stroke="#23201c" stroke-width="22" stroke-linecap="round"/>
  <path d="M372,302 L496,268" stroke="#fbfaf6" stroke-width="17" stroke-linecap="round"/>
  <circle cx="506" cy="268" r="12" fill="#fbfaf6" stroke="#23201c" stroke-width="2"/>
  <g transform="translate(330,234) scale(0.8)">
    <use href="#pn-head"/><use href="#pn-ex-ai"/><use href="#pn-ex-namida"/>
    <!-- 高い立烏帽子（秀吉の印） -->
    
    <path d="M-20,-44 L-14,-100 Q2,-112 16,-98 L20,-44 Z" fill="#23201c"/>
    <!-- 首に下げた瓢箪（秀吉の印） -->
    <path d="M-34,44 Q0,64 34,44" fill="none" stroke="#9b2d20" stroke-width="3"/><path d="M0,58 V62" stroke="#23201c" stroke-width="3"/><circle cx="0" cy="68" r="7" fill="#e3c46a" stroke="#23201c" stroke-width="2.5"/><circle cx="0" cy="86" r="12" fill="#e3c46a" stroke="#23201c" stroke-width="2.5"/><path d="M-7,76 Q0,79 7,76" fill="none" stroke="#9b2d20" stroke-width="2.5"/>
  </g>

  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif" text-anchor="middle">
    <text x="195" y="70" font-size="18" fill="#4f4940">天正18年（1590）10月、郡山</text>
    <text x="290" y="415" font-size="20" font-weight="700" fill="#9b2d20">兄・秀吉</text>
    <text x="640" y="415" font-size="20" font-weight="700" fill="#2f5d7c">弟・秀長</text>
  </g>
</svg>
