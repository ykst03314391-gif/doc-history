<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="秀長に任された役目が、長島攻めの先陣の一手から、但馬の城代、但馬の平定、四国の総大将、九州の日向口の大将へと、段を上るように大きくなっていくイメージ。段ごとに旗が増え、いちばん上の段に秀長（折烏帽子と首の小豆）が立つ">
