<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="天正13年（1585）6月、総大将として淡路から阿波へ渡る秀長の軍勢の想像図。帆を張った船団が海を進み、奥の船にはそれぞれ陣笠の兵（ぱぱねこ）が2匹ずつ乗り、手前の幟を立てた大きな船に折烏帽子に小豆の秀長（四つ足の猫のキャラ、ぱぱねこ）が乗る">
  <defs>
    <!-- ぱぱねこの頭（中心 0,0。顔の決まりは chara/README.md） -->
    <g id="pn-head">
      <circle cx="-45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <circle cx="45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-78,10 C-80,-30 -50,-47 0,-47 C50,-47 80,-30 78,10 C78,40 50,52 0,52 C-50,52 -78,40 -78,10 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-40,-3 Q-28,-15 -16,-3 M16,-3 Q28,-15 40,-3" fill="none" stroke="#23201c" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="9" rx="5" ry="4" fill="none" stroke="#23201c" stroke-width="2"/>
      <path d="M-16,17 Q-8,29 0,14 Q8,29 16,17" fill="none" stroke="#23201c" stroke-width="2" stroke-linecap="round"/>
      <path d="M-50,10 L-92,5 M-50,18 L-94,19 M-48,26 L-90,33 M50,10 L92,5 M50,18 L94,19 M48,26 L90,33" stroke="#23201c" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- 基本形のぱぱねこ（四つ足・服なし。足もと中央 0,0、頭は左、しっぽは右） -->
    <g id="pn-base">
      <path d="M-104,-92 C-110,-70 -116,-40 -116,-12 Q-116,0 -108,0 Q-100,0 -100,-10 L-100,-19 L-62,-19 L-62,-10 Q-62,0 -55,0 Q-48,0 -48,-10 L-48,-19 L14,-19 L14,-10 Q14,0 21,0 Q28,0 28,-10 L28,-19 L60,-19 L60,-10 Q60,0 67,0 Q74,0 74,-10 L74,-19 Q90,-21 93,-38 L94,-66 Q90,-74 94,-82 L96,-112 Q97,-134 84,-135 Q73,-135 67,-120 Q61,-100 50,-87 Q40,-89 20,-88 L-104,-92 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-51,-132) scale(0.95)"/>
    </g>
    <!-- 陣笠の兵（基本形のぱぱねこに陣笠） -->
    <g id="pn-heishi">
      <use href="#pn-base"/>
      <g transform="translate(-51,-132) scale(0.95)"><path d="M-72,-36 Q0,-100 72,-36 Z" fill="#4f4940" stroke="#23201c" stroke-width="3" stroke-linejoin="round"/></g>
    </g>
  </defs>
  <rect width="800" height="450" fill="#fbfaf6"/>
  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif">
<rect width="800" height="450" fill="#f4f1ea"/>
<path d="M0,170 Q200,150 400,165 Q600,150 800,168 V450 H0 Z" fill="#dfe6e6"/>
<path d="M520,168 Q600,110 700,128 Q760,136 800,150 V170 Z" fill="#c9cdb8" stroke="#8a8f7a" stroke-width="2"/>
<text x="700" y="108" font-size="18" fill="#4f4940" font-weight="700" text-anchor="middle">阿波</text>
<path d="M0,170 Q60,140 150,150 Q190,156 220,170 Z" fill="#d6d4c4" stroke="#8a8f7a" stroke-width="2"/>
<text x="90" y="132" font-size="16" fill="#4f4940" text-anchor="middle">淡路</text>
<path d="M60,230 q12,-6 24,0 q12,6 24,0" stroke="#a9b8bb" stroke-width="2" fill="none"/><path d="M260,210 q12,-6 24,0 q12,6 24,0" stroke="#a9b8bb" stroke-width="2" fill="none"/><path d="M420,250 q12,-6 24,0 q12,6 24,0" stroke="#a9b8bb" stroke-width="2" fill="none"/><path d="M600,220 q12,-6 24,0 q12,6 24,0" stroke="#a9b8bb" stroke-width="2" fill="none"/><path d="M120,330 q12,-6 24,0 q12,6 24,0" stroke="#a9b8bb" stroke-width="2" fill="none"/><path d="M330,320 q12,-6 24,0 q12,6 24,0" stroke="#a9b8bb" stroke-width="2" fill="none"/><path d="M520,360 q12,-6 24,0 q12,6 24,0" stroke="#a9b8bb" stroke-width="2" fill="none"/><path d="M680,300 q12,-6 24,0 q12,6 24,0" stroke="#a9b8bb" stroke-width="2" fill="none"/><path d="M240,410 q12,-6 24,0 q12,6 24,0" stroke="#a9b8bb" stroke-width="2" fill="none"/><path d="M600,420 q12,-6 24,0 q12,6 24,0" stroke="#a9b8bb" stroke-width="2" fill="none"/>
<g transform="translate(640,240) scale(0.35)"><path d="M-120,0 L120,0 L95,40 L-100,40 Z" fill="#8a6d46" stroke="#23201c" stroke-width="3"/><rect x="-80" y="-34" width="150" height="34" fill="#c9b48a" stroke="#23201c" stroke-width="2.5"/><path d="M0,-34 V-170" stroke="#23201c" stroke-width="5"/><rect x="-60" y="-165" width="120" height="110" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/><path d="M-60,-130 H60 M-60,-95 H60" stroke="#b8ab95" stroke-width="2"/></g>
<g transform="translate(470,270) scale(0.45)"><path d="M-120,0 L120,0 L95,40 L-100,40 Z" fill="#8a6d46" stroke="#23201c" stroke-width="3"/><rect x="-80" y="-34" width="150" height="34" fill="#c9b48a" stroke="#23201c" stroke-width="2.5"/><path d="M0,-34 V-170" stroke="#23201c" stroke-width="5"/><rect x="-60" y="-165" width="120" height="110" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/><path d="M-60,-130 H60 M-60,-95 H60" stroke="#b8ab95" stroke-width="2"/></g>
<g transform="translate(150,300) scale(0.5)"><path d="M-120,0 L120,0 L95,40 L-100,40 Z" fill="#8a6d46" stroke="#23201c" stroke-width="3"/><rect x="-80" y="-34" width="150" height="34" fill="#c9b48a" stroke="#23201c" stroke-width="2.5"/><path d="M0,-34 V-170" stroke="#23201c" stroke-width="5"/><rect x="-60" y="-165" width="120" height="110" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/><path d="M-60,-130 H60 M-60,-95 H60" stroke="#b8ab95" stroke-width="2"/></g>
<g transform="translate(330,380) scale(0.75)"><path d="M-120,0 L120,0 L95,40 L-100,40 Z" fill="#8a6d46" stroke="#23201c" stroke-width="3"/><rect x="-80" y="-34" width="150" height="34" fill="#c9b48a" stroke="#23201c" stroke-width="2.5"/><path d="M0,-34 V-170" stroke="#23201c" stroke-width="5"/><rect x="-60" y="-165" width="120" height="110" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/><path d="M-60,-130 H60 M-60,-95 H60" stroke="#b8ab95" stroke-width="2"/></g>
<!-- 総大将の船の飾り（金の縁・幟。家紋は描かない） -->
<g transform="translate(330,380) scale(0.75)">
  <path d="M-116,6 L116,6" stroke="#b08d33" stroke-width="5"/>
  <path d="M112,6 V-150" stroke="#23201c" stroke-width="4"/>
  <path d="M112,-146 H134 V-60 L123,-70 L112,-60" fill="#9b2d20" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
</g>
<!-- 他の船の兵（陣笠のぱぱねこ、各船2匹） -->
<use href="#pn-heishi" transform="translate(628,227) scale(-0.1,0.1)"/><use href="#pn-heishi" transform="translate(652,227) scale(-0.1,0.1)"/>
<use href="#pn-heishi" transform="translate(452,253) scale(-0.12,0.12)"/><use href="#pn-heishi" transform="translate(482,253) scale(-0.12,0.12)"/>
<use href="#pn-heishi" transform="translate(132,282) scale(-0.13,0.13)"/><use href="#pn-heishi" transform="translate(164,282) scale(-0.13,0.13)"/>
<g transform="translate(300,352) scale(-0.36,0.36)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/></g></g>
<text x="250" y="440" font-size="20" fill="#2f5d7c" font-weight="700" text-anchor="middle">総大将の秀長</text>
<text x="30" y="40" font-size="18" fill="#4f4940" text-anchor="start">天正13年（1585）6月、淡路から阿波へ</text>
  </g>
</svg>
