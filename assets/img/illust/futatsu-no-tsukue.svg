<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="二つの机のイメージ。左は天正のころ、数珠を下げた興福寺の僧（四つ足の猫のキャラ）が日記を書き、右は文政のころ、頭巾の藤堂家の学者が古い本を積んで記録を編む。あいだに二百年あまりの霞がかかる">
