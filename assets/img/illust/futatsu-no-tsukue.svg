<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="二つの机のイメージ。左は天正のころ、数珠を下げた興福寺の僧（四つ足の猫のキャラ）が日記を書き、右は文政のころ、頭巾の藤堂家の学者が古い本を積んで記録を編む。左は寺の花頭窓（外に五重塔）、右は組子の障子。上に天正13年（1585）から文政元年（1818）への年表の線、あいだに二百年あまりのすやり霞がかかる">
