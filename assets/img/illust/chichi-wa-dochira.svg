<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="秀長の家系図のイメージ。上に父の候補の木下弥右衛門と竹阿弥、まんなかに母の大政所。子の段に姉のとも・兄の秀吉・秀長・妹の朝日姫が並び、秀長へは二人の父の候補から点線と「？」が引かれる。秀長の下には早世した与一郎と、養子の秀保。左下から、帽子のぱぱねこ（四つ足の猫のキャラ）が虫めがねで見上げる">
