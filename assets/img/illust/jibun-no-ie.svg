<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="二つの見方を比べるイメージイラスト。左は「補佐役」の見方で、兄の家の外に弟が立って従う。右は同時代の姿で、天下の上に建つ兄の家の中に兄と弟が並ぶ。人物はみな服を着ない四つ足の猫のキャラ（ぱぱねこ）で描き、秀吉は立烏帽子と首の瓢箪、秀長は折烏帽子と首の小豆で見分ける">
  <defs>
    <!-- ぱぱねこの頭（中心 0,0。顔の決まりは chara/README.md） -->
    <g id="pn-head">
      <circle cx="-45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <circle cx="45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-78,10 C-80,-30 -50,-47 0,-47 C50,-47 80,-30 78,10 C78,40 50,52 0,52 C-50,52 -78,40 -78,10 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-40,-3 Q-28,-15 -16,-3 M16,-3 Q28,-15 40,-3" fill="none" stroke="#23201c" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="9" rx="5" ry="4" fill="none" stroke="#23201c" stroke-width="2"/>
      <path d="M-16,17 Q-8,29 0,14 Q8,29 16,17" fill="none" stroke="#23201c" stroke-width="2" stroke-linecap="round"/>
      <path d="M-50,10 L-92,5 M-50,18 L-94,19 M-48,26 L-90,33 M50,10 L92,5 M50,18 L94,19 M48,26 L90,33" stroke="#23201c" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- 基本形のぱぱねこ（四つ足・服なし。足もと中央 0,0、頭は左、しっぽは右） -->
    <g id="pn-base">
      <path d="M-109,-82 C-123,-48 -123,-8 -117,0 L-99,0 L-81,-18 L-39,-18 L-37,0 L-23,0 L-21,-16 L55,-16 L57,0 L71,0 L73,-16 L97,-18 Q93,-26 99,-30 Q125,-46 127,-86 L127,-110 Q127,-118 119,-118 L111,-118 Q103,-118 102,-108 Q99,-88 87,-86 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-51,-132) scale(0.95)"/>
    </g>
    <marker id="ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4f4940"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#fbfaf6"/>
  <path d="M400,30 V420" stroke="#d9d2c5" stroke-width="2" stroke-dasharray="4 6"/>

  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif" text-anchor="middle">
    <!-- 左：補佐役の見方 -->
    <text x="200" y="52" font-size="20" font-weight="700" fill="#4f4940">「補佐役」の見方</text>
    <rect x="70" y="140" width="200" height="150" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2.5"/>
    <path d="M45,142 L170,92 L295,142 Z" fill="#4f4940" stroke="#23201c" stroke-width="2"/>
    <text x="170" y="132" font-size="16" font-weight="700" fill="#fbfaf6">兄の家</text>
    <g transform="translate(170,280) scale(-0.346,0.346)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-20,-44 L-14,-100 Q2,-112 16,-98 L20,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,64 34,44" fill="none" stroke="#9b2d20" stroke-width="3"/><path d="M0,58 V62" stroke="#23201c" stroke-width="3"/><circle cx="0" cy="68" r="7" fill="#e3c46a" stroke="#23201c" stroke-width="2.5"/><circle cx="0" cy="86" r="12" fill="#e3c46a" stroke="#23201c" stroke-width="2.5"/><path d="M-7,76 Q0,79 7,76" fill="none" stroke="#9b2d20" stroke-width="2.5"/></g></g>
    <g transform="translate(342,300) scale(0.288,0.288)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/></g></g>
    <path d="M300,284 L276,270" stroke="#4f4940" stroke-width="2" marker-end="url(#ai)"/>
    <text x="342" y="322" font-size="15" fill="#4f4940">従う</text>
    <text x="188" y="184" font-size="14" font-weight="700" fill="#9b2d20">秀吉</text>
    <text x="327" y="232" font-size="14" font-weight="700" fill="#2f5d7c">秀長</text>
    <text x="200" y="370" font-size="18" fill="#4f4940">兄の家の外にいる補佐役</text>

    <!-- 右：同時代の姿 -->
    <text x="600" y="52" font-size="20" font-weight="700" fill="#9b2d20">同時代の姿</text>
    <ellipse cx="600" cy="302" rx="185" ry="24" fill="#efe2b8" stroke="#b08d33" stroke-width="2.5"/>
    <rect x="460" y="140" width="280" height="160" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2.5"/>
    <text x="760" y="296" font-size="17" font-weight="700" fill="#8a6d1f">天下</text>
    <path d="M435,142 L600,84 L765,142 Z" fill="#4f4940" stroke="#23201c" stroke-width="2"/>
    <text x="600" y="130" font-size="17" font-weight="700" fill="#fbfaf6">兄弟の家（羽柴家）</text>
    <g transform="translate(560,288) scale(-0.346,0.346)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-20,-44 L-14,-100 Q2,-112 16,-98 L20,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,64 34,44" fill="none" stroke="#9b2d20" stroke-width="3"/><path d="M0,58 V62" stroke="#23201c" stroke-width="3"/><circle cx="0" cy="68" r="7" fill="#e3c46a" stroke="#23201c" stroke-width="2.5"/><circle cx="0" cy="86" r="12" fill="#e3c46a" stroke="#23201c" stroke-width="2.5"/><path d="M-7,76 Q0,79 7,76" fill="none" stroke="#9b2d20" stroke-width="2.5"/></g></g>
    <g transform="translate(650,288) scale(0.317,0.317)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/></g></g>
    <text x="600" y="370" font-size="18" font-weight="700" fill="#9b2d20">兄の家の中の二人目</text>
    <text x="600" y="398" font-size="15" fill="#4f4940">兄の天下は、自分の家の天下</text>
    <text x="578" y="192" font-size="14" font-weight="700" fill="#9b2d20">秀吉</text>
    <text x="636" y="192" font-size="14" font-weight="700" fill="#2f5d7c">秀長</text>
  </g>
</svg>
