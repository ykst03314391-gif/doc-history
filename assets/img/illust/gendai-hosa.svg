<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="本を読んでいた四つ足のぱぱねこ（いまの私たち）が、兄の一歩後ろに控える「名補佐役」の秀長を思い浮かべているイメージイラスト。人物はみな服を着ない四つ足の猫のキャラ（ぱぱねこ）で描き、秀吉は立烏帽子と首の瓢箪、秀長は折烏帽子と首の小豆で見分ける">
  <defs>
    <!-- ぱぱねこの頭（中心 0,0。顔の決まりは chara/README.md） -->
    <g id="pn-head">
      <circle cx="-45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <circle cx="45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-78,10 C-80,-30 -50,-47 0,-47 C50,-47 80,-30 78,10 C78,40 50,52 0,52 C-50,52 -78,40 -78,10 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-40,-3 Q-28,-15 -16,-3 M16,-3 Q28,-15 40,-3" fill="none" stroke="#23201c" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="9" rx="5" ry="4" fill="none" stroke="#23201c" stroke-width="2"/>
      <path d="M-16,17 Q-8,29 0,14 Q8,29 16,17" fill="none" stroke="#23201c" stroke-width="2" stroke-linecap="round"/>
      <path d="M-50,10 L-92,5 M-50,18 L-94,19 M-48,26 L-90,33 M50,10 L92,5 M50,18 L94,19 M48,26 L90,33" stroke="#23201c" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- 基本形のぱぱねこ（四つ足・服なし。足もと中央 0,0、頭は左、しっぽは右） -->
    <g id="pn-base">
      <path d="M-109,-82 C-123,-48 -123,-8 -117,0 L-99,0 L-81,-18 L-39,-18 L-37,0 L-23,0 L-21,-16 L55,-16 L57,0 L71,0 L73,-16 L97,-18 Q93,-26 99,-30 Q125,-46 127,-86 L127,-110 Q127,-118 119,-118 L111,-118 Q103,-118 102,-108 Q99,-88 87,-86 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-51,-132) scale(0.95)"/>
    </g>
  </defs>
  <rect width="800" height="450" fill="#fbfaf6"/>
  <path d="M40,400 H760" stroke="#d9d2c5" stroke-width="3"/>

  <!-- いまの私たち＝ぱぱねこ本人（基本形の四つ足。服は着せない） -->
  <path d="M126,316 C112,350 112,390 118,398 L136,398 L154,380 L196,380 L198,398 L212,398 L214,382 L290,382 L292,398 L306,398 L308,382 L332,380 Q328,372 334,368 Q360,352 362,312 L362,288 Q362,280 354,280 L346,280 Q338,280 337,290 Q334,310 322,312 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
  <g transform="translate(184,266) scale(0.95)"><use href="#pn-head"/></g>
  <!-- 読んでいた本 -->
  <path d="M40,398 L72,386 L74,392 L44,402 Z M74,392 L104,384 L108,396 L76,402 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M40,398 L44,402 L76,402 L108,396 L110,400 L76,406 L42,406 Z" fill="#8a6d1f" stroke="#23201c" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 思い浮かべる像 -->
  <circle cx="268" cy="196" r="7" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2"/>
  <circle cx="300" cy="164" r="11" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2"/>
  <circle cx="338" cy="132" r="15" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2"/>
  <ellipse cx="560" cy="200" rx="215" ry="150" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2.5"/>
  <g transform="translate(505,285) scale(-0.432,0.432)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-20,-44 L-14,-100 Q2,-112 16,-98 L20,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,64 34,44" fill="none" stroke="#9b2d20" stroke-width="3"/><path d="M0,58 V62" stroke="#23201c" stroke-width="3"/><circle cx="0" cy="68" r="7" fill="#e3c46a" stroke="#23201c" stroke-width="2.5"/><circle cx="0" cy="86" r="12" fill="#e3c46a" stroke="#23201c" stroke-width="2.5"/><path d="M-7,76 Q0,79 7,76" fill="none" stroke="#9b2d20" stroke-width="2.5"/></g></g>
  <g transform="translate(626,280) scale(0.346,0.346)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/></g></g>
  <path d="M590,290 Q620,300 650,290" stroke="#a39a8c" stroke-width="2" fill="none"/>

  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif" text-anchor="middle">
    <text x="560" y="104" font-size="22" font-weight="700" fill="#2f5d7c">「名補佐役」秀長</text>
    <text x="560" y="336" font-size="16" fill="#4f4940">一歩下がって、兄を陰で支える</text>
    <text x="527" y="303" font-size="14" font-weight="700" fill="#9b2d20">秀吉</text>
    <text x="634" y="303" font-size="14" font-weight="700" fill="#2f5d7c">秀長</text>
    <text x="198" y="432" font-size="18" font-weight="700" fill="#23201c">いまの私たち</text>
  </g>
</svg>
