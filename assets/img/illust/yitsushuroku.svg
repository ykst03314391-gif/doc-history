<g transform="translate(170,372) scale(-0.600,0.600)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><use href="#pn-ex-raku"/><path d="M-8,-45 Q-12,-60 0,-63 L28,-66 Q36,-63 31,-56 L4,-52 Q3,-48 8,-45 Z" fill="#23201c"/></g></g>
<rect x="250" y="320" width="240" height="20" fill="#6b5a46" stroke="#23201c" stroke-width="2"/><path d="M264,340 V362 M476,340 V362" stroke="#6b5a46" stroke-width="8"/>
<rect x="276" y="308" width="100" height="12" fill="#fbfaf6" stroke="#a39a8c" stroke-width="1.5"/>
<rect x="392" y="282" width="56" height="38" fill="#c9b98f" stroke="#23201c" stroke-width="2"/><rect x="420" y="286" width="14" height="30" fill="#fbfaf6" stroke="#23201c" stroke-width="1"/>
<text x="427" y="297" font-size="10" fill="#23201c" font-weight="700" text-anchor="middle">聿</text><text x="427" y="310" font-size="10" fill="#23201c" font-weight="700" text-anchor="middle">脩</text>
<path d="M262,262 L292,306" stroke="#23201c" stroke-width="4" stroke-linecap="round"/>
<g stroke="#23201c" stroke-width="1.5"><rect x="520" y="330" width="90" height="12" fill="#b8ab95"/><rect x="524" y="318" width="82" height="12" fill="#c9b98f"/><rect x="518" y="342" width="94" height="14" fill="#b8ab95"/></g>
<text x="565" y="384" font-size="13" fill="#4f4940" text-anchor="middle">藩祖の古い記録</text>
<circle cx="295" cy="232" r="6" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2"/><circle cx="340" cy="215" r="9" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2"/><circle cx="385" cy="198" r="13" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2"/><ellipse cx="590" cy="160" rx="185" ry="110" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2.5"/>
<g transform="translate(500,222) scale(-0.270,0.270)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><use href="#pn-ex-do"/><path d="M-20,-44 L-14,-100 Q2,-112 16,-98 L20,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,64 34,44" fill="none" stroke="#9b2d20" stroke-width="3"/><path d="M0,58 V62" stroke="#23201c" stroke-width="3"/><circle cx="0" cy="68" r="7" fill="#e3c46a" stroke="#23201c" stroke-width="2.5"/><circle cx="0" cy="86" r="12" fill="#e3c46a" stroke="#23201c" stroke-width="2.5"/><path d="M-7,76 Q0,79 7,76" fill="none" stroke="#9b2d20" stroke-width="2.5"/><use href="#pn-ex-ikari"/></g></g>
<g transform="translate(600,222) scale(-0.290,0.290)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><use href="#pn-ex-raku"/><path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/></g></g>
<g transform="translate(700,222) scale(0.270,0.270)"><use href="#pn-fuse"/><g transform="translate(-100,-58) rotate(-12) scale(0.95)"><use href="#pn-ex-raku"/></g></g>
<text x="590" y="80" font-size="17" fill="#4f4940" font-weight="700" text-anchor="middle">温厚で、兄の厳しさを補う弟</text>
<text x="505" y="245" font-size="13" fill="#9b2d20" font-weight="700" text-anchor="middle">秀吉</text><text x="605" y="245" font-size="13" fill="#2f5d7c" font-weight="700" text-anchor="middle">秀長</text><text x="690" y="245" font-size="13" fill="#4f4940" font-weight="700" text-anchor="middle">大名</text>
<text x="170" y="404" font-size="18" fill="#8a6d1f" font-weight="700" text-anchor="middle">藤堂家の学者</text><text x="170" y="428" font-size="13" fill="#4f4940" text-anchor="middle">（文政元年〈1818〉ごろ）</text>
  </g>
</svg>
