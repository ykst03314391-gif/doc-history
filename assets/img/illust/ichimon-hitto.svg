<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="羽柴家の席順のイメージイラスト。屋根の下、上座に当主の秀吉、そのすぐ下に一門筆頭の秀長、さらに下に一門・家臣が並ぶ。人物はみな服を着ない四つ足の猫のキャラ（ぱぱねこ）で描き、秀吉は立烏帽子と首の瓢箪、秀長は折烏帽子と首の小豆で見分ける">
  <defs>
    <!-- ぱぱねこの頭（中心 0,0。顔の決まりは chara/README.md） -->
    <g id="pn-head">
      <circle cx="-45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <circle cx="45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-78,10 C-80,-30 -50,-47 0,-47 C50,-47 80,-30 78,10 C78,40 50,52 0,52 C-50,52 -78,40 -78,10 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-40,-3 Q-28,-15 -16,-3 M16,-3 Q28,-15 40,-3" fill="none" stroke="#23201c" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="9" rx="5" ry="4" fill="none" stroke="#23201c" stroke-width="2"/>
      <path d="M-16,17 Q-8,29 0,14 Q8,29 16,17" fill="none" stroke="#23201c" stroke-width="2" stroke-linecap="round"/>
      <path d="M-50,10 L-92,5 M-50,18 L-94,19 M-48,26 L-90,33 M50,10 L92,5 M50,18 L94,19 M48,26 L90,33" stroke="#23201c" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- 基本形のぱぱねこ（四つ足・服なし。足もと中央 0,0、頭は左、しっぽは右） -->
    <g id="pn-base">
      <path d="M-104,-92 C-110,-70 -116,-40 -116,-12 Q-116,0 -108,0 Q-100,0 -100,-10 L-100,-19 L-62,-19 L-62,-10 Q-62,0 -55,0 Q-48,0 -48,-10 L-48,-19 L14,-19 L14,-10 Q14,0 21,0 Q28,0 28,-10 L28,-19 L60,-19 L60,-10 Q60,0 67,0 Q74,0 74,-10 L74,-19 Q90,-21 93,-38 L94,-66 Q90,-74 94,-82 L96,-112 Q97,-134 84,-135 Q73,-135 67,-120 Q61,-100 50,-87 Q40,-89 20,-88 L-104,-92 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-51,-132) scale(0.95)"/>
    </g>
  </defs>
  <rect width="800" height="450" fill="#fbfaf6"/>

  <!-- 家 -->
  <rect x="90" y="110" width="620" height="315" fill="#f4f1ea" stroke="#a39a8c" stroke-width="3"/>
  <path d="M50,114 L400,24 L750,114 Z" fill="#4f4940" stroke="#23201c" stroke-width="3"/>
  <path d="M110,220 H690 M110,310 H690" stroke="#d9d2c5" stroke-width="2" stroke-dasharray="6 6"/>

  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif">
    <text x="400" y="96" font-size="24" font-weight="700" fill="#fbfaf6" text-anchor="middle">羽柴家</text>

    <!-- 当主 -->
    <g transform="translate(400.5,217) scale(-0.390,0.390)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-20,-44 L-14,-100 Q2,-112 16,-98 L20,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,64 34,44" fill="none" stroke="#9b2d20" stroke-width="3"/><path d="M0,58 V62" stroke="#23201c" stroke-width="3"/><circle cx="0" cy="68" r="7" fill="#e3c46a" stroke="#23201c" stroke-width="2.5"/><circle cx="0" cy="86" r="12" fill="#e3c46a" stroke="#23201c" stroke-width="2.5"/><path d="M-7,76 Q0,79 7,76" fill="none" stroke="#9b2d20" stroke-width="2.5"/></g></g>
    <text x="470" y="180" font-size="18" fill="#4f4940">当主</text>
    <text x="470" y="204" font-size="22" font-weight="700" fill="#9b2d20">秀吉</text>

    <!-- 一門筆頭 -->
    <rect x="335" y="222" width="130" height="84" rx="8" fill="none" stroke="#9b2d20" stroke-width="3"/>
    <g transform="translate(400.5,305) scale(-0.325,0.325)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/></g></g>
    <text x="482" y="262" font-size="18" fill="#9b2d20" font-weight="700">一門筆頭</text>
    <text x="482" y="288" font-size="22" font-weight="700" fill="#2f5d7c">秀長</text>

    <!-- 一門・家臣 -->
    <g transform="translate(171.5,412) scale(0.273,0.273)"><use href="#pn-base"/></g>
    <g transform="translate(251.5,412) scale(0.273,0.273)"><use href="#pn-base"/></g>
    <g transform="translate(549.5,412) scale(0.273,0.273)"><use href="#pn-base"/></g>
    <g transform="translate(629.5,412) scale(0.273,0.273)"><use href="#pn-base"/></g>
    <text x="400" y="390" font-size="20" fill="#4f4940" text-anchor="middle">一門・家臣</text>
  </g>
</svg>
