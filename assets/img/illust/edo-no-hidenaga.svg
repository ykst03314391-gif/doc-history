<text x="90" y="270" font-size="16" fill="#23201c" font-weight="700" text-anchor="middle">『太閤記』</text><text x="90" y="294" font-size="14" fill="#4f4940" text-anchor="middle">身内びいきの一門</text>
<path d="M171,112 L245,122 L319,112 L319,228 L245,238 L171,228 Z" fill="#8a6d1f" stroke="#23201c" stroke-width="2"/>
