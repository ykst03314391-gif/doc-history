<g transform="translate(563,210) scale(0.240,0.240)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><use href="#pn-ex-ai"/><path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/></g></g>
<text x="555" y="270" font-size="16" fill="#23201c" font-weight="700" text-anchor="middle">『常山紀談』</text><text x="555" y="294" font-size="14" fill="#4f4940" text-anchor="middle">慎重すぎる大将</text>
<rect x="647" y="106" width="136" height="132" rx="6" fill="none" stroke="#9b2d20" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="715" y="192" font-size="64" fill="#9b2d20" font-weight="700" text-anchor="middle">？</text>
<text x="715" y="270" font-size="16" fill="#9b2d20" font-weight="700" text-anchor="middle">温厚な補佐の弟</text><text x="715" y="294" font-size="14" fill="#4f4940" text-anchor="middle">どこにもいない</text>
<text x="400" y="410" font-size="15" fill="#4f4940" text-anchor="middle">（どれも秀長の死から何十年もあとの書物）</text>
  </g>
