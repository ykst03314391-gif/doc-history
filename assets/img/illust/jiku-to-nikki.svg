<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="床の間に掛けた春岳院の秀長像（江戸時代の作）の前で、ぱぱねこ（四つ足の猫のキャラ）が文机の同時代の日記と掛け軸を見比べて首をかしげるイメージ">
  <defs>
    <!-- ぱぱねこの頭（中心 0,0。顔の決まりは chara/README.md） -->
    <g id="pn-head">
      <circle cx="-45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <circle cx="45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-78,10 C-80,-30 -50,-47 0,-47 C50,-47 80,-30 78,10 C78,40 50,52 0,52 C-50,52 -78,40 -78,10 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-40,-3 Q-28,-15 -16,-3 M16,-3 Q28,-15 40,-3" fill="none" stroke="#23201c" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="9" rx="5" ry="4" fill="none" stroke="#23201c" stroke-width="2"/>
      <path d="M-16,17 Q-8,29 0,14 Q8,29 16,17" fill="none" stroke="#23201c" stroke-width="2" stroke-linecap="round"/>
      <path d="M-50,10 L-92,5 M-50,18 L-94,19 M-48,26 L-90,33 M50,10 L92,5 M50,18 L94,19 M48,26 L90,33" stroke="#23201c" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- 基本形のぱぱねこ（四つ足・服なし。足もと中央 0,0、頭は左、しっぽは右） -->
    <g id="pn-base">
      <path d="M-104,-92 C-110,-70 -116,-40 -116,-12 Q-116,0 -108,0 Q-100,0 -100,-10 L-100,-19 L-62,-19 L-62,-10 Q-62,0 -55,0 Q-48,0 -48,-10 L-48,-19 L14,-19 L14,-10 Q14,0 21,0 Q28,0 28,-10 L28,-19 L60,-19 L60,-10 Q60,0 67,0 Q74,0 74,-10 L74,-19 Q90,-21 93,-38 L94,-66 Q90,-74 94,-82 L96,-112 Q97,-134 84,-135 Q73,-135 67,-120 Q61,-100 50,-87 Q40,-89 20,-88 L-104,-92 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-51,-132) scale(0.95)"/>
    </g>
  </defs>
  <rect width="800" height="450" fill="#fbfaf6"/>
  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif">
<rect x="0" y="360" width="800" height="90" fill="#efe9dc"/><path d="M0,360 H800" stroke="#d9d2c5" stroke-width="2"/>
<rect x="470" y="30" width="250" height="330" fill="#f4f1ea" stroke="#a39a8c" stroke-width="3"/>
<rect x="535" y="44" width="120" height="270" fill="#c9b48a" stroke="#6b5a46" stroke-width="2"/><rect x="547" y="74" width="96" height="200" fill="#efe6d2" stroke="#8a7a62" stroke-width="1.5"/>
<path d="M528,44 H662 M528,314 H662" stroke="#4f4940" stroke-width="6" stroke-linecap="round"/><path d="M595,44 V20" stroke="#6b5a46" stroke-width="2"/>
<path d="M565,262 Q570,200 595,192 Q620,200 625,262 Z" fill="#4f4940"/><path d="M572,262 Q560,250 556,262 M618,262 Q630,250 634,262" stroke="#4f4940" stroke-width="6" fill="none"/>
<circle cx="595" cy="172" r="15" fill="#efe6d2" stroke="#4f4940" stroke-width="2"/><path d="M584,160 L586,138 Q596,132 606,140 L604,160 Z" fill="#23201c"/>
<text x="595" y="395" font-size="17" fill="#4f4940" text-anchor="middle">春岳院の秀長像（江戸時代の作）</text>
<rect x="250" y="300" width="170" height="14" fill="#6b5a46"/><path d="M262,314 V360 M408,314 V360" stroke="#6b5a46" stroke-width="6"/>
<path d="M260,298 L335,288 L410,298 L335,305 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2"/><path d="M280,296 H320 M280,292 H318 M350,294 H395 M350,290 H392" stroke="#4f4940" stroke-width="1.2"/>
<text x="335" y="280" font-size="16" fill="#4f4940" text-anchor="middle">同時代の日記</text>
<g transform="rotate(-6 160 300)"><g transform="translate(160,358) scale(-0.6,0.6)"><use href="#pn-base"/></g></g>
<path d="M232,170 q0,-22 20,-22 q20,0 20,18 q0,14 -18,20 v12" fill="none" stroke="#9b2d20" stroke-width="5" stroke-linecap="round"/><circle cx="254" cy="218" r="4" fill="#9b2d20"/>
<text x="160" y="410" font-size="20" fill="#23201c" font-weight="700" text-anchor="middle">ぱぱねこ</text>
<text x="400" y="440" font-size="15" fill="#8a6d1f" text-anchor="middle">絵の秀長と、同時代の秀長は同じか</text>
  </g>
</svg>
