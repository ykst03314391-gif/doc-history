<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="雲の上からのぞく信長が、ひびの入った敵の家（朝倉・武田）から家臣を一人つまみ出しているイメージイラスト。隣の羽柴家には手を伸ばしておらず、家の中に秀吉と秀長が並んで座っている">
  <defs>
    <symbol id="sz" viewBox="-70 -150 140 150" overflow="visible">
      <path d="M-36,-52 L36,-52 L62,0 L-62,0 Z" fill="currentColor" fill-opacity="0.8" stroke="#23201c" stroke-width="2"/>
      <path d="M-24,-100 L24,-100 L28,-50 L-28,-50 Z" fill="#efe9dc" stroke="#23201c" stroke-width="2"/>
      <path d="M-50,-100 L50,-100 L42,-88 L22,-88 L17,-52 L-17,-52 L-22,-88 L-42,-88 Z" fill="currentColor" stroke="#23201c" stroke-width="2"/>
      <path d="M-9,-100 L0,-82 L9,-100 Z" fill="#f4f1ea" stroke="#23201c" stroke-width="1.5"/>
      <circle cx="0" cy="-121" r="19" fill="#ecdcc2" stroke="#23201c" stroke-width="2"/>
      <path d="M-18,-127 A19,19 0 0 1 18,-127 Q0,-119 -18,-127 Z" fill="#23201c"/>
      <path d="M-3,-139 L-3,-148 L13,-145 L13,-141 Z" fill="#23201c"/>
    </symbol>
    <symbol id="st" viewBox="-60 -200 120 200" overflow="visible">
      <path d="M-34,-92 L34,-92 L44,0 L-44,0 Z" fill="currentColor" fill-opacity="0.8" stroke="#23201c" stroke-width="2"/>
      <path d="M0,-70 V0" stroke="#23201c" stroke-width="1.5"/>
      <path d="M-26,-140 L26,-140 L30,-90 L-30,-90 Z" fill="#efe9dc" stroke="#23201c" stroke-width="2"/>
      <path d="M-54,-140 L54,-140 L44,-128 L24,-128 L18,-92 L-18,-92 L-24,-128 L-44,-128 Z" fill="currentColor" stroke="#23201c" stroke-width="2"/>
      <path d="M-9,-140 L0,-120 L9,-140 Z" fill="#f4f1ea" stroke="#23201c" stroke-width="1.5"/>
      <circle cx="0" cy="-162" r="20" fill="#ecdcc2" stroke="#23201c" stroke-width="2"/>
      <path d="M-19,-168 A20,20 0 0 1 19,-168 Q0,-160 -19,-168 Z" fill="#23201c"/>
      <path d="M-3,-180 L-3,-190 L14,-187 L14,-183 Z" fill="#23201c"/>
    </symbol>
  </defs>
  <rect width="800" height="450" fill="#fbfaf6"/>
  <path d="M30,360 H770" stroke="#a39a8c" stroke-width="3"/>

  <!-- 敵の家（傾いてひびが入る） -->
  <g transform="rotate(-3 190 360)">
    <rect x="60" y="200" width="260" height="160" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2.5"/>
    <path d="M40,202 L190,150 L340,202 Z" fill="#6b6259" stroke="#23201c" stroke-width="2"/>
    <path d="M236,168 L252,160 L262,172 L276,166 L270,184 L246,186 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="1.5"/>
    <path d="M300,212 l-12,26 l10,20 l-14,30 l8,18" fill="none" stroke="#23201c" stroke-width="2"/>
    <path d="M92,220 l10,22 l-8,16" fill="none" stroke="#23201c" stroke-width="2"/>
    <use href="#sz" x="91" y="263" width="77" height="82" color="#a39a8c"/>
    <use href="#sz" x="191" y="263" width="77" height="82" color="#a39a8c"/>
  </g>

  <!-- 羽柴家 -->
  <rect x="470" y="200" width="270" height="160" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2.5"/>
  <path d="M450,202 L605,150 L760,202 Z" fill="#4f4940" stroke="#23201c" stroke-width="2"/>
  <use href="#sz" x="511" y="250" width="98" height="105" color="#9b2d20"/>
  <use href="#sz" x="614" y="257" width="91" height="98" color="#2f5d7c"/>

  <!-- 雲の上の信長 -->
  <circle cx="400" cy="62" r="50" fill="#ecdcc2" stroke="#23201c" stroke-width="2.5"/>
  <path d="M351,54 A50,50 0 0 1 449,54 Q400,74 351,54 Z" fill="#23201c"/>
  <path d="M392,14 L392,2 L424,8 L424,14 Z" fill="#23201c"/>
  <circle cx="380" cy="80" r="4" fill="#23201c"/>
  <circle cx="398" cy="80" r="4" fill="#23201c"/>
  <g fill="#fbfaf6" stroke="#a39a8c" stroke-width="2">
    <circle cx="334" cy="134" r="28"/>
    <circle cx="374" cy="126" r="34"/>
    <circle cx="424" cy="128" r="36"/>
    <circle cx="470" cy="136" r="28"/>
  </g>

  <!-- 伸びる手と、つまみ出される家臣 -->
  <path d="M338,112 L350,134 L262,128 L256,108 Z" fill="#4f4940" stroke="#23201c" stroke-width="2"/>
  <use href="#st" x="229" y="122" width="42" height="70" color="#a39a8c"/>
  <circle cx="252" cy="118" r="11" fill="#ecdcc2" stroke="#23201c" stroke-width="2"/>
  <g stroke="#9b2d20" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M216,150 q-8,6 0,12"/>
    <path d="M290,150 q8,6 0,12"/>
  </g>

  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif" text-anchor="middle">
    <text x="520" y="40" font-size="20" font-weight="700" fill="#23201c">信長</text>
    <text x="185" y="236" font-size="16" font-weight="700" fill="#4f4940">敵の家（朝倉・武田）</text>
    <text x="605" y="190" font-size="17" font-weight="700" fill="#fbfaf6">羽柴家</text>
    <text x="190" y="400" font-size="19" font-weight="700" fill="#9b2d20">崩すために取り立てる</text>
    <text x="605" y="400" font-size="19" font-weight="700" fill="#2f5d7c">崩す相手ではない</text>
  </g>
</svg>
