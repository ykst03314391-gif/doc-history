<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="大正の書斎で、眼鏡をかけた歴史家が、机の上の江戸時代の記録『聿脩録』を引いて、秀長を温厚な人と書く大正の本を作っているイメージイラスト。歴史家は穏やかな顔。人物はみな服を着ない四つ足の猫のキャラ（ぱぱねこ）で描き、歴史家は眼鏡で見分ける">
  <defs>
