<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="大きな主人の手のひらの上に、小さな家臣が座っているイメージイラスト。手の上には城（領国）と与力の大名も載っている">
  <defs>
    <symbol id="sz" viewBox="-70 -150 140 150" overflow="visible">
      <path d="M-36,-52 L36,-52 L62,0 L-62,0 Z" fill="currentColor" fill-opacity="0.8" stroke="#23201c" stroke-width="2"/>
      <path d="M-24,-100 L24,-100 L28,-50 L-28,-50 Z" fill="#efe9dc" stroke="#23201c" stroke-width="2"/>
      <path d="M-50,-100 L50,-100 L42,-88 L22,-88 L17,-52 L-17,-52 L-22,-88 L-42,-88 Z" fill="currentColor" stroke="#23201c" stroke-width="2"/>
      <path d="M-9,-100 L0,-82 L9,-100 Z" fill="#f4f1ea" stroke="#23201c" stroke-width="1.5"/>
      <circle cx="0" cy="-121" r="19" fill="#ecdcc2" stroke="#23201c" stroke-width="2"/>
      <path d="M-18,-127 A19,19 0 0 1 18,-127 Q0,-119 -18,-127 Z" fill="#23201c"/>
      <path d="M-3,-139 L-3,-148 L13,-145 L13,-141 Z" fill="#23201c"/>
    </symbol>
  </defs>
  <rect width="800" height="450" fill="#fbfaf6"/>

  <!-- 大きな主人 -->
  <rect x="60" y="225" width="190" height="240" fill="#efe9dc" stroke="#23201c" stroke-width="3"/>
  <path d="M-10,235 L320,235 L292,275 L232,275 L222,460 L88,460 L78,275 L18,275 Z" fill="#9b2d20" stroke="#23201c" stroke-width="3"/>
  <path d="M130,235 L155,290 L180,235 Z" fill="#f4f1ea" stroke="#23201c" stroke-width="2"/>
  <circle cx="155" cy="135" r="92" fill="#ecdcc2" stroke="#23201c" stroke-width="3"/>
  <path d="M65,115 A92,92 0 0 1 245,115 Q155,150 65,115 Z" fill="#23201c"/>
  <path d="M140,46 L140,24 L196,32 L196,42 Z" fill="#23201c"/>
  <g stroke="#23201c" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M150,158 q12,-8 24,0"/>
    <path d="M200,158 q12,-8 24,0"/>
    <path d="M178,198 q18,12 36,0"/>
  </g>

  <!-- 腕と手 -->
  <path d="M236,250 L392,300 L386,348 L230,300 Z" fill="#9b2d20" stroke="#23201c" stroke-width="3"/>
  <ellipse cx="418" cy="290" rx="13" ry="32" transform="rotate(-35 418 290)" fill="#ecdcc2" stroke="#23201c" stroke-width="3"/>
  <path d="M380,298 Q386,352 470,354 L642,347 Q684,344 690,322 Q694,302 674,302 L662,318 Q560,326 470,322 Q420,320 402,296 Z" fill="#ecdcc2" stroke="#23201c" stroke-width="3"/>

  <!-- 手の上 -->
  <path d="M410,322 L452,322 L446,304 L416,304 Z" fill="#b8ab95" stroke="#23201c" stroke-width="1.5"/>
  <rect x="419" y="286" width="24" height="18" fill="#f4f1ea" stroke="#23201c" stroke-width="1.5"/>
  <path d="M412,288 L450,288 L442,276 L420,276 Z" fill="#4f4940"/>
  <path d="M422,276 L440,276 L434,265 L428,265 Z" fill="#4f4940"/>
  <use href="#sz" x="495" y="247" width="70" height="75" color="#2f5d7c"/>
  <use href="#sz" x="580" y="277" width="42" height="45" color="#a39a8c"/>
  <use href="#sz" x="612" y="277" width="42" height="45" color="#a39a8c"/>

  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif" fill="#23201c">
    <text x="600" y="78" font-size="24" font-weight="700" text-anchor="middle">みな兄から与えられたもの</text>
    <g stroke="#4f4940" stroke-width="1.5">
      <path d="M431,212 V258"/>
      <path d="M530,170 V240"/>
      <path d="M630,212 V268"/>
    </g>
    <text x="431" y="204" font-size="16" text-anchor="middle">領国（大和・紀伊）</text>
    <text x="530" y="162" font-size="18" font-weight="700" fill="#2f5d7c" text-anchor="middle">秀長と跡目</text>
    <text x="640" y="204" font-size="16" text-anchor="middle">与力の大名</text>
  </g>
</svg>
