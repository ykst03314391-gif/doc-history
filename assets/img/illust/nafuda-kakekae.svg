<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="呼び名の名札を掛け替えるイメージ。横木に、小竹・小一郎・長秀・秀長・宰相・中納言・大納言の名札が左から順に下がり、折烏帽子に小豆の秀長（四つ足の猫のキャラ、ぱぱねこ）が最後の「大納言」の札を見上げる">
