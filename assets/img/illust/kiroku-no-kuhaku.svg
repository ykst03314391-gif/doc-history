<text x="30" y="40" font-size="18" fill="#4f4940" text-anchor="start">天文〜元亀のころ（1541〜1572）、尾張・中村</text>
<text x="770" y="160" font-size="18" fill="#8a6d1f" font-weight="700" text-anchor="end">同時代の史料に</text>
<text x="770" y="186" font-size="18" fill="#8a6d1f" font-weight="700" text-anchor="end">ほとんど出てこない30年</text>
  </g>
</svg>
