<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="記録の空白のイメージ。尾張・中村の村の遠景に霧がかかり、首に小豆を下げた若いころの秀長（四つ足の猫のキャラ、ぱぱねこ）が霧の中へ歩いていく。生まれてから30代半ばまで、同時代の史料にほとんど出てこない">
