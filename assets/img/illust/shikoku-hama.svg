<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="四国攻めのイメージイラスト（浜の陣から海の向こうの島影を見る大将と、海を渡る船）">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e3d6"/>
      <stop offset="0.6" stop-color="#f0dccb"/>
      <stop offset="1" stop-color="#e6c1a4"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8aa3ac"/>
      <stop offset="1" stop-color="#5b7480"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="560" cy="170" r="48" fill="#c66b5f" opacity="0.6"/>

  <!-- island across the sea -->
  <path d="M300,262 Q380,214 450,236 Q520,196 610,226 Q690,208 800,236 L800,270 L300,270 Z" fill="#7d8a86" opacity="0.55"/>
  <path d="M430,266 Q520,236 600,250 Q700,236 800,252 L800,272 L430,272 Z" fill="#5f6d6a" opacity="0.5"/>

  <!-- sea -->
  <rect y="268" width="800" height="182" fill="url(#sea)"/>
  <g stroke="#f4f1ea" stroke-width="1.4" opacity="0.35" fill="none">
    <path d="M300,292 q30,-5 60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0"/>
    <path d="M260,330 q30,-5 60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0"/>
    <path d="M220,372 q30,-5 60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0"/>
  </g>

  <!-- ships -->
  <g fill="#23201c">
    <g transform="translate(520,300)">
      <path d="M-46,0 L46,0 L36,12 L-38,12 Z"/>
      <rect x="-2" y="-46" width="4" height="46"/>
      <rect x="-22" y="-42" width="44" height="34" fill="#efe9dc" stroke="#23201c" stroke-width="2"/>
    </g>
    <g transform="translate(650,286) scale(0.7)">
      <path d="M-46,0 L46,0 L36,12 L-38,12 Z"/>
      <rect x="-2" y="-46" width="4" height="46"/>
      <rect x="-22" y="-42" width="44" height="34" fill="#efe9dc" stroke="#23201c" stroke-width="2"/>
    </g>
    <g transform="translate(410,282) scale(0.5)">
      <path d="M-46,0 L46,0 L36,12 L-38,12 Z"/>
      <rect x="-2" y="-46" width="4" height="46"/>
      <rect x="-22" y="-42" width="44" height="34" fill="#efe9dc" stroke="#23201c" stroke-width="2"/>
    </g>
  </g>

  <!-- beach -->
  <path d="M0,300 Q160,312 300,360 Q360,400 380,450 L0,450 Z" fill="#d8c7a2"/>
  <path d="M0,300 Q160,312 300,360 Q360,400 380,450" fill="none" stroke="#f4f1ea" stroke-width="3" opacity="0.7"/>

  <!-- jinmaku (camp curtain) -->
  <g>
    <rect x="0" y="232" width="230" height="64" fill="#f4f1ea" stroke="#23201c" stroke-width="2"/>
    <rect x="0" y="252" width="230" height="22" fill="#23201c"/>
    <g fill="#6b5a46">
      <rect x="6" y="220" width="6" height="96"/>
      <rect x="110" y="220" width="6" height="96"/>
      <rect x="218" y="220" width="6" height="96"/>
    </g>
  </g>
  <!-- nobori -->
  <g>
    <rect x="34" y="96" width="4" height="210" fill="#4f4940"/>
    <rect x="38" y="104" width="26" height="110" fill="#9b2d20"/>
    <rect x="186" y="110" width="4" height="196" fill="#4f4940"/>
    <rect x="190" y="118" width="26" height="104" fill="#9b2d20"/>
  </g>

  <!-- the commander, standing, looking out to sea -->
  <g fill="#23201c">
    <!-- legs -->
    <path d="M262,394 L272,334 L286,334 L282,394 Z"/>
    <path d="M292,394 L290,334 L304,334 L314,394 Z"/>
    <!-- skirt armor -->
    <path d="M256,342 L320,342 L312,302 L264,302 Z"/>
    <!-- torso -->
    <path d="M266,304 L310,304 L314,250 L262,250 Z"/>
    <!-- shoulder plates -->
    <path d="M248,254 L270,246 L272,280 L252,282 Z"/>
    <path d="M306,246 L330,256 L326,282 L306,280 Z"/>
    <!-- helmet -->
    <circle cx="288" cy="232" r="17"/>
    <path d="M262,236 Q288,220 314,236 L318,244 Q288,232 258,244 Z"/>
    <path d="M276,216 L268,190 L282,214 Z M300,216 L308,190 L294,214 Z"/>
  </g>
  <!-- saihai (command baton) -->
  <path d="M326,272 L362,250" stroke="#4f4940" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#f4f1ea" stroke-width="2" stroke-linecap="round">
    <path d="M362,250 L376,262 M362,250 L380,252 M362,250 L374,240"/>
  </g>
  <path d="M312,268 L328,274" stroke="#23201c" stroke-width="10" stroke-linecap="round"/>
</svg>
