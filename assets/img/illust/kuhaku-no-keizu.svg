    </g>
    <!-- 基本形のぱぱねこ（四つ足・服なし。足もと中央 0,0、頭は左、しっぽは右） -->
    <g id="pn-base">
      <path d="M-104,-92 C-110,-70 -116,-40 -116,-12 Q-116,0 -108,0 Q-100,0 -100,-10 L-100,-19 L-62,-19 L-62,-10 Q-62,0 -55,0 Q-48,0 -48,-10 L-48,-19 L14,-19 L14,-10 Q14,0 21,0 Q28,0 28,-10 L28,-19 L60,-19 L60,-10 Q60,0 67,0 Q74,0 74,-10 L74,-19 Q90,-21 93,-38 L94,-66 Q90,-74 94,-82 L96,-112 Q97,-134 84,-135 Q73,-135 67,-120 Q61,-100 50,-87 Q40,-89 20,-88 L-104,-92 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-51,-132) scale(0.95)"/>
    </g>
    <!-- 伏せる（基本形を低くし、頭を前へ下げる。足もと中央 0,0、頭は左） -->
    <g id="pn-fuse">
      <path d="M-104,-92 C-110,-70 -116,-40 -116,-12 Q-116,0 -108,0 Q-100,0 -100,-10 L-100,-19 L-62,-19 L-62,-10 Q-62,0 -55,0 Q-48,0 -48,-10 L-48,-19 L14,-19 L14,-10 Q14,0 21,0 Q28,0 28,-10 L28,-19 L60,-19 L60,-10 Q60,0 67,0 Q74,0 74,-10 L74,-19 Q90,-21 93,-38 L94,-66 Q90,-74 94,-82 L96,-112 Q97,-134 84,-135 Q73,-135 67,-120 Q61,-100 50,-87 Q40,-89 20,-88 L-104,-92 Z" transform="scale(1,0.7)" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-100,-58) rotate(-12) scale(0.95)"/>
    </g>
      <g id="pn-ex-ase"><path d="M62,-30 Q54,-16 62,-12 Q70,-16 62,-30 Z" fill="#dfe9f0" stroke="#2f5d7c" stroke-width="2"/></g>
  </defs>
  <rect width="800" height="450" fill="#fbfaf6"/>
  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif">
<path d="M400,20 V36" stroke="#6b5a46" stroke-width="2"/><rect x="150" y="36" width="500" height="12" rx="4" fill="#6b5a46"/><rect x="160" y="48" width="480" height="330" fill="#f4f1ea" stroke="#6b5a46" stroke-width="2"/><rect x="146" y="378" width="508" height="14" rx="5" fill="#6b5a46"/><rect x="330" y="70" width="140" height="56" rx="4" fill="#fbfaf6" stroke="#2f5d7c" stroke-width="2.5"/><text x="400" y="106" font-size="22" fill="#2f5d7c" font-weight="700" text-anchor="middle">秀長</text><path d="M470,98 H500" stroke="#23201c" stroke-width="2"/><path d="M400,126 V170 H275 V200 M400,170 H525 V200" fill="none" stroke="#23201c" stroke-width="2"/><rect x="500" y="70" width="128" height="56" rx="4" fill="none" stroke="#a39a8c" stroke-width="2" stroke-dasharray="6 5"/><text x="564" y="94" font-size="16" fill="#23201c" font-weight="700" text-anchor="middle">正室</text><text x="564" y="116" font-size="13" fill="#9b2d20" text-anchor="middle">名も出自も？</text><rect x="200" y="200" width="150" height="66" rx="4" fill="#fbfaf6" stroke="#23201c" stroke-width="2"/><text x="275" y="228" font-size="18" fill="#23201c" font-weight="700" text-anchor="middle">与一郎</text><text x="275" y="252" font-size="13" fill="#4f4940" text-anchor="middle">天正10年ごろ没</text><rect x="450" y="200" width="150" height="66" rx="4" fill="#fbfaf6" stroke="#23201c" stroke-width="2"/><text x="525" y="228" font-size="18" fill="#23201c" font-weight="700" text-anchor="middle">秀保</text><text x="525" y="252" font-size="13" fill="#4f4940" text-anchor="middle">甥。養子に入り跡を継ぐ</text><text x="275" y="300" font-size="16" fill="#9b2d20" font-weight="700" text-anchor="middle">母は？</text><g opacity="0.55"><g transform="translate(720,440) scale(0.42,0.42)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-40,-3 l-9,-6 M-40,-3 l-10,0 M40,-3 l9,-6 M40,-3 l10,0" stroke="#23201c" stroke-width="2" stroke-linecap="round"/></g></g></g><g fill="none" stroke="#a39a8c" stroke-width="2" stroke-dasharray="5 5"><path d="M640,140 Q712,190 712,282"/></g><text x="712" y="302" font-size="15" fill="#8a6d1f" font-weight="700" text-anchor="middle">慈雲院</text><text x="400" y="420" font-size="15" fill="#4f4940" text-anchor="middle">法名でしか知られない正室</text>
  </g>
</svg>
