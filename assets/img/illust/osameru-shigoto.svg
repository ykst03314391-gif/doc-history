<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="天正15年5月、日向の陣で、秀長（折烏帽子と首の小豆）が文机に向かい、降った島津家久が頭を下げて控える想像図。陣幕の前には、軍勢の乱暴を禁じる制札が立つ">
  <defs>
    <!-- 表情（眉なし。目と口だけを描き替える。見本は chara/papaneko-hyojo.svg）。頭の座標で重ねる -->
