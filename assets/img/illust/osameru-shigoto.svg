ffdf6" stroke="#23201c" stroke-width="2"/></g><path d="M470,330 L490,300" stroke="#23201c" stroke-width="3"/><g transform="translate(300,370) scale(-0.550,0.550)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><use href="#pn-ex-raku"/><path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/></g></g><text x="300" y="404" font-size="18" fill="#2f5d7c" font-weight="700" text-anchor="middle">秀長</text><g transform="translate(640,372) scale(0.550,0.550)"><use href="#pn-fuse"/><g transform="translate(-100,-58) rotate(-12) scale(0.95)"><use href="#pn-ex-"/><path d="M-18,-44 L-14,-74 Q0,-82 14,-74 L18,-44 Z" fill="#23201c"/></g></g><text x="620" y="404" font-size="18" fill="#23201c" font-weight="700" text-anchor="middle">島津家久</text>
