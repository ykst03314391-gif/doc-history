<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="二つの窓口のイメージ。左半分は暗い四畳半の茶室（床の間の掛け軸・下地窓・炉の釜）で、頭巾の宗易（千利休）と数珠の大名がひざを突き合わせてひそひそ話す「内々の儀」。右半分は明るい表の広間（襖・畳）で、左に書状を前にした宰相（秀長）、右に大名3人が同じ高さで向き合う「公儀の事」。人物はみな四つ足の猫のキャラ（ぱぱねこ）">
