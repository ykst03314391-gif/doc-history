<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="二つの窓口のイメージ。左半分は暗く狭い茶室で、頭巾の宗易（千利休）と数珠の大名がひざを突き合わせてひそひそ話す「内々の儀」。右半分は明るく広い広間で、上段の宰相（秀長）が書状を前にし、居並ぶ大名たちに向き合う「公儀の事」。人物はみな四つ足の猫のキャラ（ぱぱねこ）">
