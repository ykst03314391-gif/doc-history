<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="「北野にて大茶湯を催す」と書いた札と茶釜をはさみ、高い烏帽子に瓢箪の兄・秀吉がうれしそうに乗り気で、折烏帽子に小豆の弟・秀長が汗をかいた困り顔で「兄上、時期尚早です」と意見する、というイメージイラスト（ドラマの場面から）。人物は四つ足の猫のキャラ（ぱぱねこ）">
  <defs>
    <!-- 表情（眉なし。目と口だけを描き替える。見本は chara/papaneko-hyojo.svg）。頭の座標で重ねる -->
