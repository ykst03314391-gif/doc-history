troke-width="2"/><path d="M630,143 L620,175 L655,142" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/><path d="M632,141 H653" stroke="#fff" stroke-width="4"/><text x="640" y="113" font-size="18" fill="#23201c" text-anchor="middle">兄上、時期尚早です</text><path d="M120,262 l12,6 M140,238 l6,12 M168,232 l0,13" stroke="#b08d33" stroke-width="3" stroke-linecap="round"/><text x="170" y="420" font-size="20" fill="#9b2d20" font-weight="700" text-anchor="middle">兄・秀吉</text><text x="630" y="420" font-size="20" fill="#2f5d7c" font-weight="700" text-anchor="middle">弟・秀長</text>
