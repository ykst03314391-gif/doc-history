    </g>
    <!-- 伏せる（基本形を低くし、頭を前へ下げる。足もと中央 0,0、頭は左） -->
    <g id="pn-fuse">
      <path d="M-104,-92 C-110,-70 -116,-40 -116,-12 Q-116,0 -108,0 Q-100,0 -100,-10 L-100,-19 L-62,-19 L-62,-10 Q-62,0 -55,0 Q-48,0 -48,-10 L-48,-19 L14,-19 L14,-10 Q14,0 21,0 Q28,0 28,-10 L28,-19 L60,-19 L60,-10 Q60,0 67,0 Q74,0 74,-10 L74,-19 Q90,-21 93,-38 L94,-66 Q90,-74 94,-82 L96,-112 Q97,-134 84,-135 Q73,-135 67,-120 Q61,-100 50,-87 Q40,-89 20,-88 L-104,-92 Z" transform="scale(1,0.7)" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-100,-58) rotate(-12) scale(0.95)"/>
    </g>
      <g id="pn-ex-ase"><path d="M62,-30 Q54,-16 62,-12 Q70,-16 62,-30 Z" fill="#dfe9f0" stroke="#2f5d7c" stroke-width="2"/></g>
  </defs>
  <rect width="800" height="450" fill="#fbfaf6"/>
  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif">
<rect x="0" y="390" width="800" height="60" fill="#efe9dc"/><path d="M0,390 H800" stroke="#d9d2c5" stroke-width="2"/><rect x="40" y="120" width="260" height="170" rx="8" fill="#23201c"/><rect x="54" y="134" width="232" height="142" fill="#f4f1ea"/><path d="M170,290 V320 M130,320 H210" stroke="#23201c" stroke-width="8"/><g transform="translate(205,262) scale(0.34,0.34)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><use href="#pn-ex-raku"/><path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/></g></g><rect x="121.5" y="85" width="97" height="30" rx="4" fill="#fbfaf6" stroke="#2f5d7c" stroke-width="2"/><text x="170" y="105" font-size="15" fill="#2f5d7c" font-weight="700" text-anchor="middle">温厚な領主</text><rect x="470" y="300" width="250" height="16" fill="#6b5a46"/><path d="M485,316 V390 M705,316 V390" stroke="#6b5a46" stroke-width="6"/><path d="M490,300 L595,284 L700,300 L595,308 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2"/><path d="M515,296 H570 M515,291 H565 M620,294 H680 M620,289 H675" stroke="#4f4940" stroke-width="1.2"/><rect x="486.5" y="85" width="217" height="30" rx="4" fill="#fbfaf6" stroke="#9b2d20" stroke-width="2"/><text x="595" y="105" font-size="15" fill="#9b2d20" font-weight="700" text-anchor="middle">商売の停止・押し貸し・人夫</text><rect x="549.0" y="130" width="92" height="30" rx="4" fill="#fbfaf6" stroke="#8a6d1f" stroke-width="2"/><text x="595" y="150" font-size="14" fill="#8a6d1f" font-weight="700" text-anchor="middle">多聞院日記</text><path d="M595,165 V270" stroke="#a39a8c" stroke-width="2" stroke-dasharray="5 5"/><g transform="translate(330,395) scale(-0.55,0.55)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><use href="#pn-ex-ai"/><g fill="none" stroke="#23201c" stroke-width="2.5"><circle cx="-28" cy="-5" r="16"/><circle cx="28" cy="-5" r="16"/><path d="M-12,-8 Q0,-14 12,-8"/></g></g></g><path d="M330,200 l20,0 M340,190 l0,20" stroke="none"/><text x="390" y="210" font-size="40" fill="#4f4940" font-weight="700" text-anchor="middle">⇔</text><text x="400" y="432" font-size="18" fill="#8a6d1f" font-weight="700" text-anchor="middle">日記を開いて比べる</text>
  </g>
