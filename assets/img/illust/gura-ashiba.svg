<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="ぐらぐらの足場の上に立つ秀長のイメージイラスト。足場の脚はどれも折れかけ、そばの「城」「家臣」の文字には×がついている。人物はみな服を着ない四つ足の猫のキャラ（ぱぱねこ）で描き、秀吉は立烏帽子と首の瓢箪、秀長は折烏帽子と首の小豆で見分ける">
  <defs>
    <!-- ぱぱねこの頭（中心 0,0。顔の決まりは chara/README.md） -->
    <g id="pn-head">
      <circle cx="-45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <circle cx="45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-78,10 C-80,-30 -50,-47 0,-47 C50,-47 80,-30 78,10 C78,40 50,52 0,52 C-50,52 -78,40 -78,10 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-40,-3 Q-28,-15 -16,-3 M16,-3 Q28,-15 40,-3" fill="none" stroke="#23201c" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="9" rx="5" ry="4" fill="none" stroke="#23201c" stroke-width="2"/>
      <path d="M-16,17 Q-8,29 0,14 Q8,29 16,17" fill="none" stroke="#23201c" stroke-width="2" stroke-linecap="round"/>
      <path d="M-50,10 L-92,5 M-50,18 L-94,19 M-48,26 L-90,33 M50,10 L92,5 M50,18 L94,19 M48,26 L90,33" stroke="#23201c" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- 基本形のぱぱねこ（四つ足・服なし。足もと中央 0,0、頭は左、しっぽは右） -->
    <g id="pn-base">
      <path d="M-109,-82 C-123,-48 -123,-8 -117,0 L-99,0 L-81,-18 L-39,-18 L-37,0 L-23,0 L-21,-16 L55,-16 L57,0 L71,0 L73,-16 L97,-18 Q93,-26 99,-30 Q125,-46 127,-86 L127,-110 Q127,-118 119,-118 L111,-118 Q103,-118 102,-108 Q99,-88 87,-86 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-51,-132) scale(0.95)"/>
    </g>
  </defs>
  <rect width="800" height="450" fill="#fbfaf6"/>
  <path d="M40,385 H760" stroke="#a39a8c" stroke-width="3"/>

  <!-- 脚（折れかけ） -->
  <g stroke="#8a7a62" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M230,242 Q220,275 234,300"/>
    <path d="M226,322 Q216,355 230,384"/>
    <path d="M400,226 Q412,262 398,292"/>
    <path d="M404,316 Q392,352 404,384"/>
    <path d="M570,212 Q558,250 572,282"/>
    <path d="M568,308 Q582,348 568,384"/>
  </g>
  <g stroke="#9b2d20" stroke-width="5" stroke-linecap="round">
    <path d="M214,302 L246,322 M246,302 L214,322"/>
    <path d="M384,294 L416,314 M416,294 L384,314"/>
    <path d="M554,286 L586,306 M586,286 L554,306"/>
  </g>

  <!-- 傾いた台 -->
  <path d="M210,227 L590,195 L591,211 L211,243 Z" fill="#b8ab95" stroke="#23201c" stroke-width="2"/>

  <!-- 秀長 -->
  <g transform="rotate(-6 400 212)">
    <g transform="translate(400,212) scale(0.461,0.461)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-42,-14 L-22,-21 M22,-21 L42,-14" stroke="#23201c" stroke-width="3.5" stroke-linecap="round"/><path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/></g></g>
  </g>
  <path d="M440,72 Q434,84 440,88 Q446,84 440,72 Z" fill="#7fa6c6"/>
  <path d="M452,92 Q447,101 452,104 Q457,101 452,92 Z" fill="#7fa6c6"/>

  <!-- ぐらぐら -->
  <g stroke="#9b2d20" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M190,200 q-14,20 0,40"/>
    <path d="M172,192 q-18,28 0,56"/>
    <path d="M612,165 q14,20 0,40"/>
    <path d="M630,157 q18,28 0,56"/>
  </g>

  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif" text-anchor="middle">
    <text x="110" y="130" font-size="24" font-weight="700" fill="#9b2d20">ぐらぐら</text>
    <text x="120" y="338" font-size="52" font-weight="700" fill="#4f4940">城</text>
    <text x="690" y="338" font-size="52" font-weight="700" fill="#4f4940">家臣</text>
    <text x="326" y="96" font-size="20" font-weight="700" fill="#2f5d7c" text-anchor="end">秀長</text>
  </g>
  <g stroke="#9b2d20" stroke-width="7" stroke-linecap="round">
    <path d="M86,280 L154,352 M154,280 L86,352"/>
    <path d="M636,280 L744,352 M744,280 L636,352"/>
  </g>
</svg>
