<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="江戸時代の書き手が、行灯のそばの文机で筆をとり、兄に怒られて平伏する弟の話を書いているイメージイラスト。人物はみな服を着ない四つ足の猫のキャラ（ぱぱねこ）で描き、秀吉は立烏帽子と首の瓢箪、秀長は折烏帽子と首の小豆で見分ける">
  <defs>
    <!-- ぱぱねこの頭（中心 0,0。顔の決まりは chara/README.md） -->
    <g id="pn-head">
      <circle cx="-45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <circle cx="45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-78,10 C-80,-30 -50,-47 0,-47 C50,-47 80,-30 78,10 C78,40 50,52 0,52 C-50,52 -78,40 -78,10 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-40,-3 Q-28,-15 -16,-3 M16,-3 Q28,-15 40,-3" fill="none" stroke="#23201c" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="9" rx="5" ry="4" fill="none" stroke="#23201c" stroke-width="2"/>
      <path d="M-16,17 Q-8,29 0,14 Q8,29 16,17" fill="none" stroke="#23201c" stroke-width="2" stroke-linecap="round"/>
      <path d="M-50,10 L-92,5 M-50,18 L-94,19 M-48,26 L-90,33 M50,10 L92,5 M50,18 L94,19 M48,26 L90,33" stroke="#23201c" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- 基本形のぱぱねこ（四つ足・服なし。足もと中央 0,0、頭は左、しっぽは右） -->
    <g id="pn-base">
      <path d="M-109,-82 C-123,-48 -123,-8 -117,0 L-99,0 L-81,-18 L-39,-18 L-37,0 L-23,0 L-21,-16 L55,-16 L57,0 L71,0 L73,-16 L97,-18 Q93,-26 99,-30 Q125,-46 127,-86 L127,-110 Q127,-118 119,-118 L111,-118 Q103,-118 102,-108 Q99,-88 87,-86 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-51,-132) scale(0.95)"/>
    </g>
    <!-- 伏せる（基本形を低くし、頭を前へ下げる。足もと中央 0,0、頭は左） -->
    <g id="pn-fuse">
      <path d="M-109,-82 C-123,-48 -123,-8 -117,0 L-99,0 L-81,-18 L-39,-18 L-37,0 L-23,0 L-21,-16 L55,-16 L57,0 L71,0 L73,-16 L97,-18 Q93,-26 99,-30 Q125,-46 127,-86 L127,-110 Q127,-118 119,-118 L111,-118 Q103,-118 102,-108 Q99,-88 87,-86 Z" transform="scale(1,0.7)" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-100,-58) rotate(-12) scale(0.95)"/>
    </g>
  </defs>
  <rect width="800" height="450" fill="#fbfaf6"/>
  <rect x="0" y="360" width="800" height="90" fill="#efe9dc"/>
  <path d="M0,360 H800" stroke="#d9d2c5" stroke-width="2"/>

  <!-- 行灯 -->
  <circle cx="120" cy="270" r="70" fill="#f6dfb0" opacity="0.5"/>
  <rect x="96" y="232" width="48" height="76" fill="#f6dfb0" stroke="#6b5a46" stroke-width="2"/>
  <path d="M96,232 H144 M120,232 V308" stroke="#6b5a46" stroke-width="1.5"/>
  <path d="M100,308 L96,360 M140,308 L144,360" stroke="#6b5a46" stroke-width="3"/>

  <!-- 書き手と文机 -->
  <g transform="translate(330,360) scale(0.793,0.793)"><use href="#pn-base"/></g>
  <circle cx="372" cy="284" r="9" fill="#fbfaf6" stroke="#23201c" stroke-width="2"/>
  <path d="M376,272 L352,316" stroke="#23201c" stroke-width="4" stroke-linecap="round"/>
  <rect x="290" y="306" width="110" height="12" fill="#fbfaf6" stroke="#a39a8c" stroke-width="1.5"/>
  <rect x="200" y="318" width="260" height="22" fill="#6b5a46" stroke="#23201c" stroke-width="2"/>
  <path d="M214,340 V360 M446,340 V360" stroke="#6b5a46" stroke-width="8"/>

  <!-- 積んだ本 -->
  <g stroke="#23201c" stroke-width="1.5">
    <rect x="478" y="336" width="80" height="12" fill="#c9b98f"/>
    <rect x="482" y="324" width="74" height="12" fill="#b8ab95"/>
    <rect x="476" y="312" width="78" height="12" fill="#c9b98f"/>
    <rect x="480" y="348" width="80" height="12" fill="#b8ab95"/>
  </g>

  <!-- 思い描く話 -->
  <circle cx="402" cy="176" r="6" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2"/>
  <circle cx="430" cy="154" r="9" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2"/>
  <circle cx="462" cy="134" r="12" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2"/>
  <ellipse cx="625" cy="150" rx="150" ry="110" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2.5"/>
  <g transform="translate(580,232) scale(-0.317,0.317)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-44,-27 L-18,-17 M18,-17 L44,-27" stroke="#23201c" stroke-width="4" stroke-linecap="round"/><path d="M-20,-44 L-14,-100 Q2,-112 16,-98 L20,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,64 34,44" fill="none" stroke="#9b2d20" stroke-width="3"/><path d="M0,58 V62" stroke="#23201c" stroke-width="3"/><circle cx="0" cy="68" r="7" fill="#e3c46a" stroke="#23201c" stroke-width="2.5"/><circle cx="0" cy="86" r="12" fill="#e3c46a" stroke="#23201c" stroke-width="2.5"/><path d="M-7,76 Q0,79 7,76" fill="none" stroke="#9b2d20" stroke-width="2.5"/></g></g>
  <g stroke="#9b2d20" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M596,118 Q601,124 596,130"/>
    <path d="M614,118 Q609,124 614,130"/>
    <path d="M599,115 Q605,120 611,115"/>
    <path d="M599,133 Q605,128 611,133"/>
  </g>
  <g transform="translate(684,232) scale(0.278,0.278)"><use href="#pn-fuse"/><g transform="translate(-100,-58) rotate(-12) scale(0.95)"><path d="M-42,-14 L-22,-21 M22,-21 L42,-14" stroke="#23201c" stroke-width="3.5" stroke-linecap="round"/><path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/></g></g>

  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif" text-anchor="middle">
    <text x="625" y="84" font-size="17" font-weight="700" fill="#4f4940">罵られる弟</text>
    <text x="330" y="400" font-size="20" font-weight="700" fill="#8a6d1f">江戸時代の書き手</text>
    <text x="625" y="292" font-size="15" fill="#4f4940">（秀長の死から何十年もあと）</text>
    <text x="590" y="254" font-size="14" font-weight="700" fill="#9b2d20">秀吉</text>
    <text x="672" y="254" font-size="14" font-weight="700" fill="#2f5d7c">秀長</text>
  </g>
</svg>
