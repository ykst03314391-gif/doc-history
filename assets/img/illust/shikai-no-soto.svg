<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="上段に座る南蛮帽子の信長が、前に平伏する秀吉を見ているイメージイラスト。秀吉の後ろに控える秀長は、信長の視界に入っていない。人物はみな服を着ない四つ足の猫のキャラ（ぱぱねこ）で描き、秀吉は立烏帽子と首の瓢箪、秀長は折烏帽子と首の小豆で見分ける">
  <defs>
    <!-- ぱぱねこの頭（中心 0,0。顔の決まりは chara/README.md） -->
    <g id="pn-head">
      <circle cx="-45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <circle cx="45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-78,10 C-80,-30 -50,-47 0,-47 C50,-47 80,-30 78,10 C78,40 50,52 0,52 C-50,52 -78,40 -78,10 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-40,-3 Q-28,-15 -16,-3 M16,-3 Q28,-15 40,-3" fill="none" stroke="#23201c" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="9" rx="5" ry="4" fill="none" stroke="#23201c" stroke-width="2"/>
      <path d="M-16,17 Q-8,29 0,14 Q8,29 16,17" fill="none" stroke="#23201c" stroke-width="2" stroke-linecap="round"/>
      <path d="M-50,10 L-92,5 M-50,18 L-94,19 M-48,26 L-90,33 M50,10 L92,5 M50,18 L94,19 M48,26 L90,33" stroke="#23201c" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- 基本形のぱぱねこ（四つ足・服なし。足もと中央 0,0、頭は左、しっぽは右） -->
    <g id="pn-base">
      <path d="M-109,-82 C-123,-48 -123,-8 -117,0 L-99,0 L-81,-18 L-39,-18 L-37,0 L-23,0 L-21,-16 L55,-16 L57,0 L71,0 L73,-16 L97,-18 Q93,-26 99,-30 Q125,-46 127,-86 L127,-110 Q127,-118 119,-118 L111,-118 Q103,-118 102,-108 Q99,-88 87,-86 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-51,-132) scale(0.95)"/>
    </g>
    <!-- 伏せる（基本形を低くし、頭を前へ下げる。足もと中央 0,0、頭は左） -->
    <g id="pn-fuse">
      <path d="M-109,-82 C-123,-48 -123,-8 -117,0 L-99,0 L-81,-18 L-39,-18 L-37,0 L-23,0 L-21,-16 L55,-16 L57,0 L71,0 L73,-16 L97,-18 Q93,-26 99,-30 Q125,-46 127,-86 L127,-110 Q127,-118 119,-118 L111,-118 Q103,-118 102,-108 Q99,-88 87,-86 Z" transform="scale(1,0.7)" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-100,-58) rotate(-12) scale(0.95)"/>
    </g>
  </defs>
  <rect width="800" height="450" fill="#fbfaf6"/>
  <rect x="0" y="340" width="800" height="110" fill="#efe9dc"/>
  <path d="M0,340 H800" stroke="#d9d2c5" stroke-width="2"/>

  <!-- 上段の信長 -->
  <rect x="40" y="300" width="230" height="42" fill="#d9cfbf" stroke="#8a7a62" stroke-width="2"/>
  <g transform="translate(150,300) scale(-0.732,0.732)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M22,-84 Q46,-116 76,-110 Q52,-104 28,-76 Z" fill="#e3c46a" stroke="#23201c" stroke-width="2"/><path d="M-26,-56 Q-28,-106 0,-108 Q28,-106 26,-56 Z" fill="#23201c"/><path d="M-26,-68 Q0,-63 26,-68 L26,-59 Q0,-54 -26,-59 Z" fill="#9b2d20"/><ellipse cx="0" cy="-56" rx="44" ry="9" fill="#23201c"/></g></g>

  <!-- 視界 -->
  <path d="M170,160 L530,226 L530,402 Z" fill="#e8c97a" fill-opacity="0.35" stroke="#b08d33" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- 秀吉と秀長 -->
  <g transform="translate(430,390) scale(0.600,0.600)"><use href="#pn-fuse"/><g transform="translate(-100,-58) rotate(-12) scale(0.95)"><path d="M-20,-44 L-14,-100 Q2,-112 16,-98 L20,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,64 34,44" fill="none" stroke="#9b2d20" stroke-width="3"/><path d="M0,58 V62" stroke="#23201c" stroke-width="3"/><circle cx="0" cy="68" r="7" fill="#e3c46a" stroke="#23201c" stroke-width="2.5"/><circle cx="0" cy="86" r="12" fill="#e3c46a" stroke="#23201c" stroke-width="2.5"/><path d="M-7,76 Q0,79 7,76" fill="none" stroke="#9b2d20" stroke-width="2.5"/></g></g>
  <ellipse cx="640" cy="330" rx="100" ry="76" fill="none" stroke="#a39a8c" stroke-width="2" stroke-dasharray="5 6"/>
  <g opacity="0.75">
    <g transform="translate(640,390) scale(0.550,0.550)"><use href="#pn-fuse"/><g transform="translate(-100,-58) rotate(-12) scale(0.95)"><path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/></g></g>
  </g>

  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif" text-anchor="middle">
    <text x="155" y="392" font-size="20" font-weight="700" fill="#23201c">天下人・信長</text>
    <text x="430" y="424" font-size="20" font-weight="700" fill="#9b2d20">秀吉</text>
    <text x="640" y="424" font-size="20" font-weight="700" fill="#2f5d7c">秀長</text>
    <text x="400" y="246" font-size="17" fill="#8a6d1f">見ているのは秀吉</text>
    <text x="640" y="238" font-size="18" font-weight="700" fill="#9b2d20">視界の外</text>
  </g>
</svg>
