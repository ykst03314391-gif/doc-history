<path d="M262,214 L330,206 L334,300 L266,308 Z" fill="#8a6d1f" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
<rect x="288" y="222" width="22" height="70" fill="#fbfaf6" stroke="#23201c" stroke-width="1" transform="rotate(-6 299 257)"/>
<g transform="rotate(-6 299 257)"><text x="299" y="244" font-size="15" fill="#23201c" font-weight="700" text-anchor="middle">補</text><text x="299" y="264" font-size="15" fill="#23201c" font-weight="700" text-anchor="middle">佐</text><text x="299" y="284" font-size="15" fill="#23201c" font-weight="700" text-anchor="middle">役</text></g>
<circle cx="360" cy="200" r="6" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2"/><circle cx="380" cy="200" r="9" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2"/><circle cx="400" cy="200" r="13" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2"/><ellipse cx="580" cy="220" rx="190" ry="125" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2.5"/>
