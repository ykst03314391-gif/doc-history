<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-label="大河「豊臣兄弟！」の秀長像の出どころの図。看板「天下一の補佐役」は1985年の堺屋太一の小説から、人物の中身（大将・大名の窓口・兄に意見する弟）は2025年の黒田基樹・柴裕之の研究から（兄に意見する弟には、江戸後期・大正の「兄を補う」型も重なる）、大和の領主の温厚な善政は1818年の藤堂家『聿脩録』と1919年の渡辺世祐の型から。父については、1996年の大河「秀吉」が採った異父弟説を採らず、兄と同じ弥右衛門とした">
  <defs>
    <!-- 表情（眉なし。目と口だけを描き替える。見本は chara/papaneko-hyojo.svg）。頭の座標で重ねる -->
    <g id="pn-ex-cover"><path d="M-47,-24 H47 V40 H-47 Z" fill="#fbfaf6" stroke="none"/><ellipse cx="0" cy="9" rx="5" ry="4" fill="none" stroke="#23201c" stroke-width="2"/></g>
    <g id="pn-ex-ki" fill="none" stroke="#23201c" stroke-linecap="round" stroke-linejoin="round"><use href="#pn-ex-cover"/><path d="M-44,0 Q-29,-20 -14,0 M14,0 Q29,-20 44,0" stroke-width="3"/><path d="M-16,17 Q-8,27 0,14 Q8,27 16,17" stroke-width="2"/><path d="M-9,23 Q0,42 9,23 Q0,27 -9,23 Z" fill="#23201c" stroke-width="1.5"/><path d="M-64,24 l6,-8 M-56,24 l6,-8 M-48,24 l6,-8 M42,24 l6,-8 M50,24 l6,-8 M58,24 l6,-8" stroke-width="1.5"/></g>
    <g id="pn-ex-do" fill="none" stroke="#23201c" stroke-linecap="round"><use href="#pn-ex-cover"/><path d="M-42,-12 L-17,-2 M17,-2 L42,-12" stroke-width="3"/><path d="M-16,28 Q-8,15 0,27 Q8,15 16,28" stroke-width="2"/></g>
    <g id="pn-ex-ai" fill="none" stroke="#23201c" stroke-linecap="round"><use href="#pn-ex-cover"/><path d="M-42,0 L-18,-9 M18,-9 L42,0" stroke-width="2.5"/><path d="M-11,27 Q-5,19 0,25 Q5,19 11,27" stroke-width="2"/></g>
    <g id="pn-ex-ikari"><path d="M70,-50 q8,0 8,-8 M86,-58 q0,8 8,8 M94,-34 q-8,0 -8,8 M78,-26 q0,-8 -8,-8" fill="none" stroke="#9b2d20" stroke-width="3.5" stroke-linecap="round"/></g>
    <g id="pn-ex-namida"><path d="M-34,6 Q-41,18 -34,22 Q-27,18 -34,6 Z" fill="#dfe9f0" stroke="#2f5d7c" stroke-width="2"/></g>
    <g id="pn-ex-raku" fill="none" stroke="#23201c" stroke-linecap="round"><use href="#pn-ex-cover"/><path d="M-40,-8 Q-28,2 -16,-8 M16,-8 Q28,2 40,-8" stroke-width="2.5"/><path d="M-16,17 Q-8,29 0,14 Q8,29 16,17" stroke-width="2"/><path d="M-62,24 l6,-8 M-54,24 l6,-8 M48,24 l6,-8 M56,24 l6,-8" stroke-width="1.5"/></g>
    <!-- ぱぱねこの頭（中心 0,0。顔の決まりは chara/README.md） -->
    <g id="pn-head">
      <circle cx="-45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <circle cx="45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-78,10 C-80,-30 -50,-47 0,-47 C50,-47 80,-30 78,10 C78,40 50,52 0,52 C-50,52 -78,40 -78,10 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-40,-3 Q-28,-15 -16,-3 M16,-3 Q28,-15 40,-3" fill="none" stroke="#23201c" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="9" rx="5" ry="4" fill="none" stroke="#23201c" stroke-width="2"/>
      <path d="M-16,17 Q-8,29 0,14 Q8,29 16,17" fill="none" stroke="#23201c" stroke-width="2" stroke-linecap="round"/>
      <path d="M-50,10 L-92,5 M-50,18 L-94,19 M-48,26 L-90,33 M50,10 L92,5 M50,18 L94,19 M48,26 L90,33" stroke="#23201c" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- 基本形のぱぱねこ（四つ足・服なし。足もと中央 0,0、頭は左、しっぽは右） -->
    <g id="pn-base">
      <path d="M-104,-92 C-110,-70 -116,-40 -116,-12 Q-116,0 -108,0 Q-100,0 -100,-10 L-100,-19 L-62,-19 L-62,-10 Q-62,0 -55,0 Q-48,0 -48,-10 L-48,-19 L14,-19 L14,-10 Q14,0 21,0 Q28,0 28,-10 L28,-19 L60,-19 L60,-10 Q60,0 67,0 Q74,0 74,-10 L74,-19 Q90,-21 93,-38 L94,-66 Q90,-74 94,-82 L96,-112 Q97,-134 84,-135 Q73,-135 67,-120 Q61,-100 50,-87 Q40,-89 20,-88 L-104,-92 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-51,-132) scale(0.95)"/>
    </g>
    <!-- 伏せる（基本形を低くし、頭を前へ下げる。足もと中央 0,0、頭は左） -->
    <g id="pn-fuse">
      <path d="M-104,-92 C-110,-70 -116,-40 -116,-12 Q-116,0 -108,0 Q-100,0 -100,-10 L-100,-19 L-62,-19 L-62,-10 Q-62,0 -55,0 Q-48,0 -48,-10 L-48,-19 L14,-19 L14,-10 Q14,0 21,0 Q28,0 28,-10 L28,-19 L60,-19 L60,-10 Q60,0 67,0 Q74,0 74,-10 L74,-19 Q90,-21 93,-38 L94,-66 Q90,-74 94,-82 L96,-112 Q97,-134 84,-135 Q73,-135 67,-120 Q61,-100 50,-87 Q40,-89 20,-88 L-104,-92 Z" transform="scale(1,0.7)" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-100,-58) rotate(-12) scale(0.95)"/>
    </g>
      <g id="pn-ex-ase"><path d="M62,-30 Q54,-16 62,-12 Q70,-16 62,-30 Z" fill="#dfe9f0" stroke="#2f5d7c" stroke-width="2"/></g>
  </defs>
  
  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4f4940"/></marker></defs><text x="180" y="30" font-size="17" fill="#23201c" font-weight="700" text-anchor="middle">これまでの秀長像</text><text x="610" y="30" font-size="17" fill="#23201c" font-weight="700" text-anchor="middle">「豊臣兄弟！」（2026）の秀長</text><rect x="20" y="60" width="320" height="64" rx="6" fill="#f4f1ea" stroke="#9b2d20" stroke-width="2"/><text x="180.0" y="87" font-size="15.5" fill="#23201c" font-weight="700" text-anchor="middle">堺屋太一の小説（1985）</text><text x="180.0" y="111" font-size="13.5" fill="#4f4940" text-anchor="middle">書名に「補佐役」</text><rect x="28" y="48" width="54" height="22" rx="4" fill="#9b2d20"/><text x="55.0" y="64" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1985</text><rect x="20" y="160" width="320" height="64" rx="6" fill="#f4f1ea" stroke="#2f5d7c" stroke-width="2"/><text x="180.0" y="187" font-size="15.5" fill="#23201c" font-weight="700" text-anchor="middle">黒田基樹・柴裕之の研究（2025）</text><text x="180.0" y="211" font-size="13.5" fill="#4f4940" text-anchor="middle">一門の筆頭・大将・大名の取次</text><rect x="28" y="148" width="54" height="22" rx="4" fill="#2f5d7c"/><text x="55.0" y="164" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">2025</text><rect x="20" y="260" width="320" height="64" rx="6" fill="#f4f1ea" stroke="#b08d33" stroke-width="2"/><text x="180.0" y="287" font-size="15.5" fill="#23201c" font-weight="700" text-anchor="middle">藤堂家『聿脩録』・渡辺世祐</text><text x="180.0" y="311" font-size="13.5" fill="#4f4940" text-anchor="middle">温厚で兄を補う・寺社にも善政</text><rect x="28" y="248" width="99" height="22" rx="4" fill="#b08d33"/><text x="77.5" y="264" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1818・1919</text><rect x="20" y="360" width="320" height="64" rx="6" fill="#f4f1ea" stroke="#a39a8c" stroke-width="2" stroke-dasharray="6 5"/><text x="180.0" y="387" font-size="15.5" fill="#23201c" font-weight="700" text-anchor="middle">大河「秀吉」（1996）</text><text x="180.0" y="411" font-size="13.5" fill="#4f4940" text-anchor="middle">『太閤素生記』の異父弟説</text><rect x="28" y="348" width="54" height="22" rx="4" fill="#8a7a62"/><text x="55.0" y="364" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">1996</text><rect x="436" y="44" width="358" height="400" rx="8" fill="#fbf3df" stroke="#9b2d20" stroke-width="2"/><rect x="450" y="60" width="330" height="64" rx="6" fill="#fbfaf6" stroke="#d9d2c5" stroke-width="2"/><text x="615.0" y="87" font-size="15.5" fill="#23201c" font-weight="700" text-anchor="middle">看板</text><text x="615.0" y="111" font-size="13.5" fill="#4f4940" text-anchor="middle">「天下一の補佐役」</text><rect x="450" y="160" width="330" height="64" rx="6" fill="#fbfaf6" stroke="#d9d2c5" stroke-width="2"/><text x="615.0" y="187" font-size="15.5" fill="#23201c" font-weight="700" text-anchor="middle">人物の中身</text><text x="615.0" y="211" font-size="13.5" fill="#4f4940" text-anchor="middle">大将・大名の窓口・兄に意見する弟</text><rect x="450" y="260" width="330" height="64" rx="6" fill="#fbfaf6" stroke="#d9d2c5" stroke-width="2"/><text x="615.0" y="287" font-size="15.5" fill="#23201c" font-weight="700" text-anchor="middle">大和の領主</text><text x="615.0" y="311" font-size="13.5" fill="#4f4940" text-anchor="middle">民のための改革（温厚な善政）</text><rect x="450" y="360" width="330" height="64" rx="6" fill="#fbfaf6" stroke="#d9d2c5" stroke-width="2"/><text x="615.0" y="387" font-size="15.5" fill="#23201c" font-weight="700" text-anchor="middle">父</text><text x="615.0" y="411" font-size="13.5" fill="#4f4940" text-anchor="middle">兄と同じ弥右衛門</text><g fill="none" stroke="#4f4940" stroke-width="2.5"><path d="M340,92 H444" marker-end="url(#ah)"/><path d="M340,192 H444" marker-end="url(#ah)"/><path d="M340,292 H444" marker-end="url(#ah)"/></g><path d="M340,280 C400,260 400,215 444,208" fill="none" stroke="#4f4940" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><path d="M340,392 H444" fill="none" stroke="#a39a8c" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M385.0,382 l20,20 M405.0,382 l-20,20" stroke="#9b2d20" stroke-width="3"/><text x="395.0" y="376" font-size="13" fill="#9b2d20" font-weight="700" text-anchor="middle">採らず</text><text x="386" y="236" font-size="12.5" fill="#4f4940" text-anchor="middle">兄を補う型</text><text x="400" y="470" font-size="14" fill="#23201c" font-weight="700" text-anchor="middle">看板は昭和の小説、中身は近年の研究、大和は江戸後期・大正の型。父は「秀吉」と逆の説</text>
  </g>
</svg>
