<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-label="秀長像ができるまでの流れ図。左の列は像の中身の流れで、江戸時代の前半の書物には温厚な補佐の弟は出てこず、1818年の藤堂家の『聿脩録』が中身を書き、大正の山路愛山・渡辺世祐が引いて広め、1967年と1985年の小説が「補佐役」の名を付けた。右の列は大友宗麟の書状で、秀長自身の言葉だったものが、戦前の史料集や『茶と利休』で利休の側から読まれ、「内々は利休、公儀は秀長」として今の像に入った">
  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4f4940"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#9b2d20"/></marker></defs>
<text x="330" y="30" font-size="17" fill="#23201c" font-weight="700" text-anchor="middle">秀長像の中身の流れ</text><text x="650" y="30" font-size="17" fill="#23201c" font-weight="700" text-anchor="middle">宗麟の書状の読まれ方</text>
<path d="M110,40 V600" stroke="#d9d2c5" stroke-width="3"/>
<circle cx="110" cy="88" r="6" fill="#9b2d20"/><text x="98" y="93" font-size="14" fill="#9b2d20" font-weight="700" text-anchor="end">1586</text>
<circle cx="110" cy="168" r="6" fill="#9b2d20"/><text x="98" y="173" font-size="14" fill="#9b2d20" font-weight="700" text-anchor="end">1600〜1700年代</text>
<circle cx="110" cy="248" r="6" fill="#9b2d20"/><text x="98" y="253" font-size="14" fill="#9b2d20" font-weight="700" text-anchor="end">1818</text>
<circle cx="110" cy="328" r="6" fill="#9b2d20"/><text x="98" y="333" font-size="14" fill="#9b2d20" font-weight="700" text-anchor="end">1915・19</text>
<circle cx="110" cy="408" r="6" fill="#9b2d20"/><text x="98" y="413" font-size="14" fill="#9b2d20" font-weight="700" text-anchor="end">1943・56</text>
<circle cx="110" cy="488" r="6" fill="#9b2d20"/><text x="98" y="493" font-size="14" fill="#9b2d20" font-weight="700" text-anchor="end">1967・85</text>
<circle cx="110" cy="578" r="6" fill="#9b2d20"/><text x="98" y="583" font-size="14" fill="#9b2d20" font-weight="700" text-anchor="end">現代</text>
<rect x="500" y="56" width="280" height="64" rx="6" fill="#f4f1ea" stroke="#d9d2c5" stroke-width="2"/><text x="640.0" y="83" font-size="16" fill="#23201c" font-weight="700" text-anchor="middle">大友宗麟の書状</text><text x="640.0" y="107" font-size="13.5" fill="#4f4940" text-anchor="middle">「公儀の事は宰相」＝秀長自身の言葉</text>
<rect x="150" y="136" width="320" height="64" rx="6" fill="none" stroke="#a39a8c" stroke-width="2" stroke-dasharray="6 5"/><text x="310.0" y="163" font-size="16" fill="#23201c" font-weight="700" text-anchor="middle">太閤記・三河物語・老人雑話ほか</text><text x="310.0" y="187" font-size="13.5" fill="#4f4940" text-anchor="middle">温厚な補佐の弟は出てこない</text>
<rect x="150" y="216" width="320" height="64" rx="6" fill="#f4f1ea" stroke="#b08d33" stroke-width="2"/><text x="310.0" y="243" font-size="16" fill="#23201c" font-weight="700" text-anchor="middle">藤堂家『聿脩録』</text><text x="310.0" y="267" font-size="13.5" fill="#4f4940" text-anchor="middle">温厚・兄の厳しさを補う・大名が頼る</text><rect x="412" y="204" width="58" height="24" rx="4" fill="#b08d33"/><text x="441" y="221" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">中身</text>
<rect x="150" y="296" width="320" height="64" rx="6" fill="#f4f1ea" stroke="#d9d2c5" stroke-width="2"/><text x="310.0" y="323" font-size="16" fill="#23201c" font-weight="700" text-anchor="middle">山路愛山・渡辺世祐</text><text x="310.0" y="347" font-size="13.5" fill="#4f4940" text-anchor="middle">『聿脩録』を引いて歴史家の評に</text><rect x="412" y="284" width="58" height="24" rx="4" fill="#2f5d7c"/><text x="441" y="301" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">広める</text>
<rect x="500" y="376" width="280" height="64" rx="6" fill="#f4f1ea" stroke="#d9d2c5" stroke-width="2"/><text x="640.0" y="403" font-size="16" fill="#23201c" font-weight="700" text-anchor="middle">史料集・『茶と利休』</text><text x="640.0" y="427" font-size="13.5" fill="#4f4940" text-anchor="middle">利休の側から読む</text>
<rect x="150" y="456" width="320" height="64" rx="6" fill="#f4f1ea" stroke="#9b2d20" stroke-width="2"/><text x="310.0" y="483" font-size="16" fill="#23201c" font-weight="700" text-anchor="middle">司馬遼太郎・堺屋太一</text><text x="310.0" y="507" font-size="13.5" fill="#4f4940" text-anchor="middle">小説の書名に「補佐役」</text><rect x="412" y="444" width="58" height="24" rx="4" fill="#9b2d20"/><text x="441" y="461" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">名前</text>
<rect x="150" y="546" width="630" height="56" rx="6" fill="#fbf3df" stroke="#9b2d20" stroke-width="2"/><text x="465.0" y="573" font-size="16" fill="#23201c" font-weight="700" text-anchor="middle">「温厚な名補佐役」の秀長像</text><text x="465.0" y="597" font-size="13.5" fill="#4f4940" text-anchor="middle"></text>
<g fill="none" stroke="#4f4940" stroke-width="2.5"><path d="M310,280 V290" marker-end="url(#ah)"/><path d="M310,360 V450" marker-end="url(#ah)"/><path d="M310,520 V540" marker-end="url(#ah)"/><path d="M640,120 V370" marker-end="url(#ah)"/></g>
<path d="M640,440 V540" fill="none" stroke="#4f4940" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="652" y="500" font-size="13" fill="#4f4940" text-anchor="start">「内々は利休、</text><text x="652" y="518" font-size="13" fill="#4f4940" text-anchor="start">公儀は秀長」</text>
  </g>
</svg>
