<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 548" role="img" aria-label="二コマ漫画（創作）。一、天正19年（1591）正月、秀長の死後、蔵で髷の家臣が「金子は、五万六千枚余……」「銀は、部屋に積んで数えきれませぬ」と銀の山を前に読み上げる。二、高い烏帽子に瓢箪の秀吉がにこにこと「小一郎め……温厚な顔をして、よう貯めたものよ」、家臣は汗をかく。人物はみな服を着ない四つ足の猫のキャラ（ぱぱねこ）で描く">
