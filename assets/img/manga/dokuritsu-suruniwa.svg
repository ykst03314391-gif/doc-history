    <g transform="translate(336.0,1027.0) scale(0.415,0.415)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><use href="#pn-ex-raku"/><path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/></g></g>
    <path d="M90,882 L74,930 L116,886 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="190" cy="856" rx="150" ry="32" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="190" y="849" font-size="15">……では、せめて</text><text x="190" y="873" font-size="15">跡継ぎは</text>
    <path d="M286,944 L316,932 L290,962 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="205" cy="950" rx="95" ry="30" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="205" y="955" font-size="15">それも兄上が決める</text>

    <rect x="20" y="812" width="380" height="250" fill="none" stroke="#23201c" stroke-width="2.5"/>
