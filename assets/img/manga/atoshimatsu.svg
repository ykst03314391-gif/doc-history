<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1082" role="img" aria-label="四コマ漫画（創作）。一、ぱぱねこが秀長に「四国攻めの総大将、お見事でした！」、秀長「うむ」。二、ぱぱねこ「でも後の本には「秀吉公の才知のおかげ」と……」、秀長「……」。三、ぱぱねこ「九州の勝ちも、兄上のお名前で」、秀長「それが兄の家の戦というものじゃ」。四、ぱぱねこ「では秀長さんの仕事は？」、禁制・返付・境目・取次・目録の書類の山の横で、秀長が汗をかいて「後始末じゃ。これが多いのよ」">
