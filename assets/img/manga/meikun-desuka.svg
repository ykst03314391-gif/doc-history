<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1082" role="img" aria-label="四コマ漫画（創作）。一、現代の記者が秀長に「秀長さん、大和では「名君」と呼ばれていますね」と尋ね、秀長が「うむ」と答える。二、郡山の町人が両手を挙げて「市が立つのは郡山だけ！秀長さま万歳！」。三、奈良の僧が日記に「あさまし……あさまし……あさまし……」と書く。四、秀長「……同じ政策なんじゃが」、記者「評判は住む町しだい、と」。人物はみな服を着ない四つ足の猫のキャラ（ぱぱねこ）で描き、記者はぱぱねこ本人。秀長は折烏帽子と首の小豆、僧は首の数珠で見分ける">
  <defs>
    <!-- ぱぱねこの頭（中心 0,0。顔の決まりは chara/README.md） -->
    <g id="pn-head">
      <circle cx="-45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <circle cx="45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-78,10 C-80,-30 -50,-47 0,-47 C50,-47 80,-30 78,10 C78,40 50,52 0,52 C-50,52 -78,40 -78,10 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-40,-3 Q-28,-15 -16,-3 M16,-3 Q28,-15 40,-3" fill="none" stroke="#23201c" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="9" rx="5" ry="4" fill="none" stroke="#23201c" stroke-width="2"/>
      <path d="M-16,17 Q-8,29 0,14 Q8,29 16,17" fill="none" stroke="#23201c" stroke-width="2" stroke-linecap="round"/>
      <path d="M-50,10 L-92,5 M-50,18 L-94,19 M-48,26 L-90,33 M50,10 L92,5 M50,18 L94,19 M48,26 L90,33" stroke="#23201c" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- 基本形のぱぱねこ（四つ足・服なし。足もと中央 0,0、頭は左、しっぽは右） -->
    <g id="pn-base">
      <path d="M-109,-82 C-123,-48 -123,-8 -117,0 L-99,0 L-81,-18 L-39,-18 L-37,0 L-23,0 L-21,-16 L55,-16 L57,0 L71,0 L73,-16 L97,-18 Q93,-26 99,-30 Q125,-46 127,-86 L127,-110 Q127,-118 119,-118 L111,-118 Q103,-118 102,-108 Q99,-88 87,-86 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-51,-132) scale(0.95)"/>
    </g>

  </defs>
  <rect width="420" height="1082" fill="#fbfaf6"/>

  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif" text-anchor="middle" fill="#23201c">
    <!-- コマ1 -->
    <rect x="20" y="20" width="380" height="250" fill="#fbfaf6"/>
    <path d="M20,235 H400" stroke="#d9d2c5" stroke-width="2"/>
    <g transform="translate(83.1,232.0) scale(-0.450,0.450)"><use href="#pn-base"/></g>
    <g transform="translate(326.0,235.0) scale(0.415,0.415)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/></g></g>
    <path d="M100,90 L86,112 L122,94 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="200" cy="64" rx="145" ry="32" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="200" y="57" font-size="15">秀長さん、大和では</text><text x="200" y="81" font-size="15">「名君」と呼ばれていますね</text>

    <path d="M262,152 L292,156 L266,140 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="240" cy="145" rx="30" ry="20" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="240" y="150" font-size="15">うむ</text>

    <rect x="20" y="20" width="380" height="250" fill="none" stroke="#23201c" stroke-width="2.5"/>
    <!-- コマ2 -->
    <rect x="20" y="284" width="380" height="250" fill="#fbfaf6"/>
    <path d="M20,499 H400" stroke="#d9d2c5" stroke-width="2"/>
    <g transform="translate(300,434) scale(0.9)"><rect x="-50" y="-10" width="100" height="40" fill="#8a7a62"/><path d="M-60,-10 L60,-10 L46,-30 L-46,-30 Z" fill="#6b5a46"/><rect x="-30" y="-60" width="60" height="30" fill="#8a7a62"/><path d="M-42,-60 L42,-60 L30,-80 L-30,-80 Z" fill="#6b5a46"/></g>
    <g transform="translate(94.5,499.0) scale(-0.397,0.397)"><use href="#pn-base"/><path d="M-112,-72 L-150,-186 M22,-70 L56,-184" stroke="#23201c" stroke-width="22" stroke-linecap="round"/><path d="M-112,-72 L-150,-186 M22,-70 L56,-184" stroke="#fbfaf6" stroke-width="17" stroke-linecap="round"/></g>
    <g transform="translate(338.5,499.0) scale(0.328,0.328)"><use href="#pn-base"/><path d="M-112,-72 L-150,-186 M22,-70 L56,-184" stroke="#23201c" stroke-width="22" stroke-linecap="round"/><path d="M-112,-72 L-150,-186 M22,-70 L56,-184" stroke="#fbfaf6" stroke-width="17" stroke-linecap="round"/></g>
    <text x="370" y="324" font-size="12" fill="#4f4940" text-anchor="end">郡山</text>
    <path d="M140,350 L110,384 L160,354 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="215" cy="326" rx="125" ry="30" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="215" y="319" font-size="15">市が立つのは郡山だけ！</text><text x="215" y="343" font-size="15">秀長さま万歳！</text>

    <rect x="20" y="284" width="380" height="250" fill="none" stroke="#23201c" stroke-width="2.5"/>
    <!-- コマ3 -->
    <rect x="20" y="548" width="380" height="250" fill="#fbfaf6"/>
    <path d="M20,763 H400" stroke="#d9d2c5" stroke-width="2"/>
    <g transform="translate(131.3,753.0) scale(-0.537,0.537)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-40,44 Q0,74 40,44" fill="none" stroke="#23201c" stroke-width="8" stroke-dasharray="0.1 10" stroke-linecap="round"/><path d="M0,59 V74" stroke="#6b5a46" stroke-width="4" stroke-linecap="round"/></g></g>
    <rect x="170" y="718" width="120" height="45" fill="#8a7a62" stroke="#23201c" stroke-width="2"/>
    <rect x="180" y="706" width="90" height="14" fill="#fbfaf6" stroke="#23201c" stroke-width="1.5"/>
    <path d="M160,698 L196,712" stroke="#23201c" stroke-width="3"/>
    <text x="380" y="752" font-size="12" fill="#4f4940" text-anchor="end">奈良</text>
    <path d="M200,656 L178,688 L220,660 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="272" cy="616" rx="108" ry="48" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="272" y="597" font-size="15">あさまし……</text><text x="272" y="621" font-size="15">あさまし……</text><text x="272" y="645" font-size="15">あさまし……</text>

    <rect x="20" y="548" width="380" height="250" fill="none" stroke="#23201c" stroke-width="2.5"/>
    <!-- コマ4 -->
    <rect x="20" y="812" width="380" height="250" fill="#fbfaf6"/>
    <path d="M20,1027 H400" stroke="#d9d2c5" stroke-width="2"/>
    <g transform="translate(78.7,1027.0) scale(-0.415,0.415)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/></g></g>
    <g transform="translate(336.9,1024.0) scale(0.450,0.450)"><use href="#pn-base"/></g>
    <path d="M90,882 L80,910 L112,885 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="160" cy="856" rx="118" ry="30" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="160" y="861" font-size="15">……同じ政策なんじゃが</text>

    <path d="M300,940 L332,936 L306,958 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="225" cy="942" rx="92" ry="34" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="225" y="935" font-size="15">評判は</text><text x="225" y="959" font-size="15">住む町しだい、と</text>

    <rect x="20" y="812" width="380" height="250" fill="none" stroke="#23201c" stroke-width="2.5"/>
  </g>
</svg>
