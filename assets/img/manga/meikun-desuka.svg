      <path d="M-28,-104 L-52,-170 M28,-104 L52,-170" stroke="currentColor" stroke-width="14" stroke-linecap="round"/>
      <circle cx="-52" cy="-172" r="8" fill="#ecdcc2" stroke="#23201c" stroke-width="1.5"/><circle cx="52" cy="-172" r="8" fill="#ecdcc2" stroke="#23201c" stroke-width="1.5"/>
      <circle cx="0" cy="-132" r="20" fill="#ecdcc2" stroke="#23201c" stroke-width="2"/>
