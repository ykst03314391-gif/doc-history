    <rect x="20" y="20" width="380" height="250" fill="none" stroke="#23201c" stroke-width="2.5"/>
    <!-- コマ2 -->
    <rect x="20" y="284" width="380" height="250" fill="#fbfaf6"/>
    <path d="M20,499 H400" stroke="#d9d2c5" stroke-width="2"/>
    <g transform="translate(300,434) scale(0.9)"><rect x="-50" y="-10" width="100" height="40" fill="#8a7a62"/><path d="M-60,-10 L60,-10 L46,-30 L-46,-30 Z" fill="#6b5a46"/><rect x="-30" y="-60" width="60" height="30" fill="#8a7a62"/><path d="M-42,-60 L42,-60 L30,-80 L-30,-80 Z" fill="#6b5a46"/></g>
    <use href="#ch" x="60" y="384" width="70" height="115" color="#8a6d1f"/>
    <use href="#ch" x="310" y="404" width="57" height="95" color="#9b2d20"/>
    <text x="370" y="324" font-size="12" fill="#4f4940" text-anchor="end">郡山</text>
    <path d="M140,350 L110,384 L160,354 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="215" cy="326" rx="125" ry="30" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="215" y="319" font-size="15">市が立つのは郡山だけ！</text><text x="215" y="343" font-size="15">秀長さま万歳！</text>

    <rect x="20" y="284" width="380" height="250" fill="none" stroke="#23201c" stroke-width="2.5"/>
    <!-- コマ3 -->
    <rect x="20" y="548" width="380" height="250" fill="#fbfaf6"/>
    <path d="M20,763 H400" stroke="#d9d2c5" stroke-width="2"/>
    <use href="#mk" x="80" y="643" width="100" height="110" color="#6b5a46"/>
    <rect x="170" y="718" width="120" height="45" fill="#8a7a62" stroke="#23201c" stroke-width="2"/>
    <rect x="180" y="706" width="90" height="14" fill="#fbfaf6" stroke="#23201c" stroke-width="1.5"/>
    <path d="M160,698 L196,712" stroke="#23201c" stroke-width="3"/>
    <text x="380" y="752" font-size="12" fill="#4f4940" text-anchor="end">奈良</text>
    <path d="M200,656 L178,688 L220,660 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="272" cy="616" rx="108" ry="48" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="272" y="597" font-size="15">あさまし……</text><text x="272" y="621" font-size="15">あさまし……</text><text x="272" y="645" font-size="15">あさまし……</text>

    <rect x="20" y="548" width="380" height="250" fill="none" stroke="#23201c" stroke-width="2.5"/>
    <!-- コマ4 -->
    <rect x="20" y="812" width="380" height="250" fill="#fbfaf6"/>
    <path d="M20,1027 H400" stroke="#d9d2c5" stroke-width="2"/>
    <use href="#st" x="40" y="907" width="75" height="120" color="#2f5d7c"/>
    <use href="#md" x="310" y="904" width="70" height="125"/>
    <path d="M90,882 L80,910 L112,885 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="160" cy="856" rx="118" ry="30" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="160" y="861" font-size="15">……同じ政策なんじゃが</text>

    <path d="M300,940 L332,936 L306,958 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="225" cy="942" rx="92" ry="34" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="225" y="935" font-size="15">評判は</text><text x="225" y="959" font-size="15">住む町しだい、と</text>

    <rect x="20" y="812" width="380" height="250" fill="none" stroke="#23201c" stroke-width="2.5"/>
  </g>
</svg>
