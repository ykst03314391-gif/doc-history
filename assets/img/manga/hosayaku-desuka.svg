<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1082" role="img" aria-label="四コマ漫画（創作）。一、現代の記者が秀長に「秀長さん、補佐役で満足でしたか？」と尋ねる。二、秀長「ほさやく……？ そんな言葉、聞いたことがないぞ」。三、秀長が胸を張って「わしは兄上の家の二番目じゃ。兄上の天下は、わが家の天下よ」。四、後ろから兄の秀吉が「小一郎、熊野の木の件じゃが」と声をかけ、秀長は「ははーっ！」と平伏する">
  <defs>
    <symbol id="st" viewBox="-60 -200 120 200" overflow="visible">
      <path d="M-34,-92 L34,-92 L44,0 L-44,0 Z" fill="currentColor" fill-opacity="0.8" stroke="#23201c" stroke-width="2"/>
      <path d="M0,-70 V0" stroke="#23201c" stroke-width="1.5"/>
      <path d="M-26,-140 L26,-140 L30,-90 L-30,-90 Z" fill="#efe9dc" stroke="#23201c" stroke-width="2"/>
      <path d="M-54,-140 L54,-140 L44,-128 L24,-128 L18,-92 L-18,-92 L-24,-128 L-44,-128 Z" fill="currentColor" stroke="#23201c" stroke-width="2"/>
      <path d="M-9,-140 L0,-120 L9,-140 Z" fill="#f4f1ea" stroke="#23201c" stroke-width="1.5"/>
      <circle cx="0" cy="-162" r="20" fill="#ecdcc2" stroke="#23201c" stroke-width="2"/>
      <path d="M-19,-168 A20,20 0 0 1 19,-168 Q0,-160 -19,-168 Z" fill="#23201c"/>
      <path d="M-3,-180 L-3,-190 L14,-187 L14,-183 Z" fill="#23201c"/>
    </symbol>
    <symbol id="bw" viewBox="-80 -110 160 110" overflow="visible">
      <path d="M-30,-40 L50,-40 L62,0 L-50,0 Z" fill="currentColor" fill-opacity="0.8" stroke="#23201c" stroke-width="2"/>
      <path d="M12,-38 L44,-44 L4,-86 L-34,-74 Z" fill="currentColor" stroke="#23201c" stroke-width="2"/>
      <path d="M-34,-60 L-62,-8 L-44,-6 L-20,-52 Z" fill="currentColor" stroke="#23201c" stroke-width="2"/>
      <rect x="-70" y="-10" width="20" height="7" rx="3" fill="#ecdcc2" stroke="#23201c" stroke-width="1.5"/>
      <circle cx="-48" cy="-72" r="17" fill="#ecdcc2" stroke="#23201c" stroke-width="2"/>
      <path d="M-34,-84 A17,17 0 0 1 -36,-58 Q-44,-72 -34,-84 Z" fill="#23201c"/>
      <path d="M-30,-80 L-24,-90 L-20,-86 L-26,-76 Z" fill="#23201c"/>
    </symbol>
    <!-- 現代の記者（手帳を持つ） -->
    <symbol id="md" viewBox="130 110 140 300" overflow="visible">
      <path d="M168,300 L158,398 L190,398 L198,312 L206,398 L238,398 L230,300 Z" fill="#4f4940" stroke="#23201c" stroke-width="2"/>
      <path d="M150,200 Q200,186 250,200 L240,306 L160,306 Z" fill="#cfdbe6" stroke="#23201c" stroke-width="2"/>
      <path d="M188,196 L200,214 L212,196" fill="none" stroke="#23201c" stroke-width="2"/>
      <path d="M152,204 L140,262 L186,262" fill="none" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
      <path d="M248,204 L260,262 L214,262" fill="none" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
      <rect x="170" y="238" width="60" height="42" rx="2" fill="#8a6d1f" stroke="#23201c" stroke-width="2"/>
      <path d="M200,238 V280" stroke="#efe2b8" stroke-width="2"/>
      <circle cx="182" cy="262" r="7" fill="#ecdcc2" stroke="#23201c" stroke-width="1.5"/>
      <circle cx="218" cy="262" r="7" fill="#ecdcc2" stroke="#23201c" stroke-width="1.5"/>
      <circle cx="200" cy="158" r="28" fill="#ecdcc2" stroke="#23201c" stroke-width="2"/>
      <path d="M172,156 Q170,126 200,124 Q232,124 229,154 Q214,140 186,146 Z" fill="#23201c"/>
    </symbol>
  </defs>
  <rect width="420" height="1082" fill="#fbfaf6"/>

  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif" text-anchor="middle" fill="#23201c">

    <!-- 一 -->
    <rect x="20" y="20" width="380" height="250" fill="#fbfaf6"/>
    <path d="M20,235 H400" stroke="#d9d2c5" stroke-width="2"/>
    <use href="#md" x="40" y="62" width="84" height="180"/>
    <use href="#st" x="270" y="85" width="90" height="150" color="#2f5d7c"/>
    <path d="M140,96 L112,104 L150,108 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="195" cy="76" rx="105" ry="42" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <path d="M141,95 L150,107" stroke="#fff" stroke-width="4"/>
    <text x="195" y="70" font-size="15">秀長さん、</text>
    <text x="195" y="94" font-size="15">補佐役で満足でしたか？</text>
    <rect x="20" y="20" width="380" height="250" fill="none" stroke="#23201c" stroke-width="2.5"/>

    <!-- 二 -->
    <rect x="20" y="284" width="380" height="250" fill="#fbfaf6"/>
    <path d="M20,499 H400" stroke="#d9d2c5" stroke-width="2"/>
    <use href="#st" x="230" y="299" width="120" height="200" color="#2f5d7c"/>
    <path d="M222,352 L262,344 L226,372 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="130" cy="368" rx="105" ry="56" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <path d="M226,356 L229,368" stroke="#fff" stroke-width="5"/>
    <text x="130" y="347" font-size="15">ほさやく……？</text>
    <text x="130" y="373" font-size="15">そんな言葉、</text>
    <text x="130" y="397" font-size="15">聞いたことがないぞ</text>
    <text x="336" y="330" font-size="30" font-weight="700" fill="#2f5d7c">？</text>
    <text x="358" y="356" font-size="20" font-weight="700" fill="#2f5d7c">？</text>
    <rect x="20" y="284" width="380" height="250" fill="none" stroke="#23201c" stroke-width="2.5"/>

    <!-- 三 -->
    <rect x="20" y="548" width="380" height="250" fill="#fbfaf6"/>
    <path d="M20,763 H400" stroke="#d9d2c5" stroke-width="2"/>
    <g stroke="#b08d33" stroke-width="3" stroke-linecap="round">
      <path d="M120,558 V570"/><path d="M78,572 L86,581"/><path d="M162,572 L154,581"/>
      <path d="M62,605 H74"/><path d="M166,605 H178"/>
    </g>
    <use href="#st" x="60" y="563" width="120" height="200" color="#2f5d7c"/>
    <path d="M100,688 Q120,668 140,676" fill="none" stroke="#23201c" stroke-width="2"/>
    <circle cx="124" cy="676" r="8" fill="#ecdcc2" stroke="#23201c" stroke-width="1.5"/>
    <path d="M190,620 L160,608 L194,640 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="285" cy="648" rx="105" ry="76" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <path d="M187,622 L190,636" stroke="#fff" stroke-width="5"/>
    <text x="285" y="618" font-size="15">わしは兄上の家の</text>
    <text x="285" y="642" font-size="15">二番目じゃ。</text>
    <text x="285" y="666" font-size="15">兄上の天下は、</text>
    <text x="285" y="690" font-size="15" font-weight="700">わが家の天下よ</text>
    <rect x="20" y="548" width="380" height="250" fill="none" stroke="#23201c" stroke-width="2.5"/>

    <!-- 四 -->
    <rect x="20" y="812" width="380" height="250" fill="#fbfaf6"/>
    <path d="M20,1027 H400" stroke="#d9d2c5" stroke-width="2"/>
    <use href="#st" x="40" y="827" width="120" height="200" color="#9b2d20"/>
    <g stroke="#9b2d20" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M136,830 Q142,836 136,842"/>
      <path d="M156,830 Q150,836 156,842"/>
      <path d="M140,826 Q146,832 152,826"/>
      <path d="M140,846 Q146,840 152,846"/>
    </g>
    <path d="M170,866 L150,872 L172,882 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="275" cy="868" rx="105" ry="40" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <path d="M171,866 L172,881" stroke="#fff" stroke-width="5"/>
    <text x="275" y="862" font-size="15">小一郎、</text>
    <text x="275" y="886" font-size="15">熊野の木の件じゃが</text>
    <use href="#bw" x="200" y="917" width="160" height="110" color="#2f5d7c"/>
    <path d="M214,940 Q208,952 214,955 Q220,952 214,940 Z" fill="#7fa6c6"/>
    <path d="M202,952 Q197,961 202,964 Q207,961 202,952 Z" fill="#7fa6c6"/>
    <text x="330" y="932" font-size="17" font-weight="700">ははーっ！</text>
    <rect x="20" y="812" width="380" height="250" fill="none" stroke="#23201c" stroke-width="2.5"/>
  </g>
</svg>
