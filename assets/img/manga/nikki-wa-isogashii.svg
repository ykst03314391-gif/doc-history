<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1082" role="img" aria-label="四コマ漫画（創作）。一、秀長が「奈良での商売は止める。売り買いは郡山でせよ」と命じ、家臣が「ははっ」。二、興福寺の僧が日記に向かって「さてさて、あさまし、あさまし……」。三、秀長が「春日社の屋根の修理はわしが持とう」と言い、家臣が「ははっ」。四、僧が日記に「……善政なり。」と書き、「忙しいのう」とつぶやく。人物はみな服を着ない四つ足の猫のキャラ（ぱぱねこ）で描き。秀長は折烏帽子と首の小豆、僧は首の数珠で見分ける">
  <defs>
    <!-- ぱぱねこの頭（中心 0,0。顔の決まりは chara/README.md） -->
    <g id="pn-head">
      <circle cx="-45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <circle cx="45" cy="-45" r="20" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-78,10 C-80,-30 -50,-47 0,-47 C50,-47 80,-30 78,10 C78,40 50,52 0,52 C-50,52 -78,40 -78,10 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5"/>
      <path d="M-40,-3 Q-28,-15 -16,-3 M16,-3 Q28,-15 40,-3" fill="none" stroke="#23201c" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="9" rx="5" ry="4" fill="none" stroke="#23201c" stroke-width="2"/>
      <path d="M-16,17 Q-8,29 0,14 Q8,29 16,17" fill="none" stroke="#23201c" stroke-width="2" stroke-linecap="round"/>
      <path d="M-50,10 L-92,5 M-50,18 L-94,19 M-48,26 L-90,33 M50,10 L92,5 M50,18 L94,19 M48,26 L90,33" stroke="#23201c" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- 基本形のぱぱねこ（四つ足・服なし。足もと中央 0,0、頭は左、しっぽは右） -->
    <g id="pn-base">
      <path d="M-109,-82 C-123,-48 -123,-8 -117,0 L-99,0 L-81,-18 L-39,-18 L-37,0 L-23,0 L-21,-16 L55,-16 L57,0 L71,0 L73,-16 L97,-18 Q93,-26 99,-30 Q125,-46 127,-86 L127,-110 Q127,-118 119,-118 L111,-118 Q103,-118 102,-108 Q99,-88 87,-86 Z" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-51,-132) scale(0.95)"/>
    </g>
    <!-- 伏せる（基本形を低くし、頭を前へ下げる。足もと中央 0,0、頭は左） -->
    <g id="pn-fuse">
      <path d="M-109,-82 C-123,-48 -123,-8 -117,0 L-99,0 L-81,-18 L-39,-18 L-37,0 L-23,0 L-21,-16 L55,-16 L57,0 L71,0 L73,-16 L97,-18 Q93,-26 99,-30 Q125,-46 127,-86 L127,-110 Q127,-118 119,-118 L111,-118 Q103,-118 102,-108 Q99,-88 87,-86 Z" transform="scale(1,0.7)" fill="#fbfaf6" stroke="#23201c" stroke-width="2.5" stroke-linejoin="round"/>
      <use href="#pn-head" transform="translate(-100,-58) rotate(-12) scale(0.95)"/>
    </g>
  </defs>
  <rect width="420" height="1082" fill="#fbfaf6"/>

  <g font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif" text-anchor="middle" fill="#23201c">
    <!-- コマ1 -->
    <rect x="20" y="20" width="380" height="250" fill="#fbfaf6"/>
    <path d="M20,235 H400" stroke="#d9d2c5" stroke-width="2"/>
    <g transform="translate(78.7,232.0) scale(-0.415,0.415)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/></g></g>
    <g transform="translate(324.5,235.0) scale(0.409,0.409)"><use href="#pn-fuse"/></g>
    <path d="M110,92 L92,120 L134,96 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="200" cy="66" rx="150" ry="32" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="200" y="59" font-size="15">奈良での商売は止める。</text><text x="200" y="83" font-size="15">売り買いは郡山でせよ</text>

    <path d="M300,158 L296,172 L310,157 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="300" cy="138" rx="36" ry="20" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="300" y="143" font-size="15">ははっ</text>

    <rect x="20" y="20" width="380" height="250" fill="none" stroke="#23201c" stroke-width="2.5"/>
    <!-- コマ2 -->
    <rect x="20" y="284" width="380" height="250" fill="#fbfaf6"/>
    <path d="M20,499 H400" stroke="#d9d2c5" stroke-width="2"/>
    <g transform="translate(119.5,490.0) scale(-0.517,0.517)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-40,44 Q0,74 40,44" fill="none" stroke="#23201c" stroke-width="8" stroke-dasharray="0.1 10" stroke-linecap="round"/><path d="M0,59 V74" stroke="#6b5a46" stroke-width="4" stroke-linecap="round"/></g></g>
    <rect x="160" y="454" width="120" height="45" fill="#8a7a62" stroke="#23201c" stroke-width="2"/>
    <rect x="170" y="442" width="90" height="14" fill="#fbfaf6" stroke="#23201c" stroke-width="1.5"/>
    <path d="M150,434 L186,448" stroke="#23201c" stroke-width="3"/>
    <text x="380" y="488" font-size="12" fill="#4f4940" text-anchor="end">興福寺の僧</text>
    <path d="M196,388 L176,422 L220,392 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="262" cy="350" rx="112" ry="46" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="262" y="343" font-size="15">さてさて</text><text x="262" y="367" font-size="15">あさまし、あさまし……</text>

    <rect x="20" y="284" width="380" height="250" fill="none" stroke="#23201c" stroke-width="2.5"/>
    <!-- コマ3 -->
    <rect x="20" y="548" width="380" height="250" fill="#fbfaf6"/>
    <path d="M20,763 H400" stroke="#d9d2c5" stroke-width="2"/>
    <g transform="translate(78.7,760.0) scale(-0.415,0.415)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-24,-44 L-20,-68 Q-4,-78 14,-72 L34,-80 L30,-62 L22,-58 L24,-44 Z" fill="#23201c"/><path d="M-34,44 Q0,62 34,44" fill="none" stroke="#2f5d7c" stroke-width="3"/><ellipse cx="0" cy="68" rx="14" ry="10" fill="#7a2a2a" stroke="#23201c" stroke-width="2.5"/><path d="M-6,62 L5,61" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/></g></g>
    <g transform="translate(324.5,763.0) scale(0.409,0.409)"><use href="#pn-fuse"/></g>
    <path d="M110,620 L92,648 L134,624 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="200" cy="594" rx="150" ry="32" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="200" y="587" font-size="15">春日社の屋根の修理は</text><text x="200" y="611" font-size="15">わしが持とう</text>

    <path d="M300,686 L296,700 L310,685 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="300" cy="666" rx="36" ry="20" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="300" y="671" font-size="15">ははっ</text>

    <rect x="20" y="548" width="380" height="250" fill="none" stroke="#23201c" stroke-width="2.5"/>
    <!-- コマ4 -->
    <rect x="20" y="812" width="380" height="250" fill="#fbfaf6"/>
    <path d="M20,1027 H400" stroke="#d9d2c5" stroke-width="2"/>
    <g transform="translate(119.5,1018.0) scale(-0.517,0.517)"><use href="#pn-base"/><g transform="translate(-51,-132) scale(0.95)"><path d="M-40,44 Q0,74 40,44" fill="none" stroke="#23201c" stroke-width="8" stroke-dasharray="0.1 10" stroke-linecap="round"/><path d="M0,59 V74" stroke="#6b5a46" stroke-width="4" stroke-linecap="round"/></g></g>
    <rect x="160" y="982" width="120" height="45" fill="#8a7a62" stroke="#23201c" stroke-width="2"/>
    <rect x="170" y="970" width="90" height="14" fill="#fbfaf6" stroke="#23201c" stroke-width="1.5"/>
    <path d="M150,962 L186,976" stroke="#23201c" stroke-width="3"/>
    <text x="380" y="1016" font-size="12" fill="#4f4940" text-anchor="end">興福寺の僧</text>
    <path d="M190,896 L170,932 L212,898 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="250" cy="862" rx="126" ry="38" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="250" y="867" font-size="17">……善政なり。</text>

    <path d="M262,944 L236,952 L258,934 Z" fill="#fff" stroke="#23201c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="310" cy="937" rx="70" ry="22" fill="#fff" stroke="#23201c" stroke-width="2"/>
    <text x="310" y="942" font-size="13">忙しいのう</text>

    <rect x="20" y="812" width="380" height="250" fill="none" stroke="#23201c" stroke-width="2.5"/>
  </g>
</svg>
