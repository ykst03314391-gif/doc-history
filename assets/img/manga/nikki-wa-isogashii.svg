<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1082" role="img" aria-label="四コマ漫画（創作）。一、秀長が「奈良での商売は止める。売り買いは郡山でせよ」と命じ、家臣が「ははっ」。二、興福寺の僧が日記に向かって「さてさて、あさまし、あさまし……」。三、秀長が「春日社の屋根の修理はわしが持とう」と言い、家臣が「ははっ」。四、僧が日記に「……善政なり。」と書き、「忙しいのう」とつぶやく">
