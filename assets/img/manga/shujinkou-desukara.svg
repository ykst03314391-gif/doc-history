<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1082" role="img" aria-label="四コマ漫画（創作）。一、ぱぱねこが秀長に「秀長さん、大河ドラマの主人公になりましたよ！」、秀長は喜んで「わしが、主役か!?」。二、ぱぱねこ「大将も、大名の取り次ぎも、ちゃんと描かれてます」、秀長「ほう、よう調べておる」。三、ぱぱねこ「奈良の商いを一日で止めた件は、民のための改革になってました」、秀長は汗をかいて「……え？」。四、秀長がにこにこと「主人公とは、ありがたいものじゃのう」、ぱぱねこは汗をかいて「……」。人物はみな服を着ない四つ足の猫のキャラ（ぱぱねこ）で描き、聞き手はぱぱねこ本人。秀長は折烏帽子と首の小豆で見分ける">
  <defs>
    <!-- 表情（眉なし。目と口だけを描き替える。見本は chara/papaneko-hyojo.svg）。頭の座標で重ねる -->
