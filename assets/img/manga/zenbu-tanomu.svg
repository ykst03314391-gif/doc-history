<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1082" role="img" aria-label="四コマ漫画（創作。秀長が長生きしていたら、のもしもの場面）。一、秀吉が「小一郎、秀頼を頼むぞ」と言い、秀長が「お任せを」。二、秀吉「大名も奉行も、頼むぞ」、秀長「お任せを」。三、秀吉「唐入りの後始末も、家康の相手も頼むぞ」、秀長「……お任せを」。四、秀長が「……して兄上、わしが倒れたら？」と聞くと、秀吉は「……」と黙り込む">
