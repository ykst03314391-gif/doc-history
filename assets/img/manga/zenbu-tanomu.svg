<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1082" role="img" aria-label="四コマ漫画（創作。秀長が長生きしていたら、のもしもの場面）。一、秀吉が「小一郎、秀頼を頼むぞ」と言い、秀長が「お任せを」。二、秀吉「大名も奉行も、頼むぞ」、秀長「お任せを」。三、秀吉「唐入りの後始末も、家康の相手も頼むぞ」、秀長「……お任せを」。四、秀長が「……して兄上、わしが倒れたら？」と聞くと、秀吉は「……」と黙り込む。秀吉は楽しげに頼み続け、三の秀長は困った顔、四は二人とも困った顔。人物はみな服を着ない四つ足の猫のキャラ（ぱぱねこ）で描き。秀長は折烏帽子と首の小豆、秀吉は立烏帽子と首の瓢箪で見分ける">
  <defs>
    <!-- 表情（眉なし。目と口だけを描き替える。見本は chara/papaneko-hyojo.svg）。頭の座標で重ねる -->
