<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1082" role="img" aria-label="四コマ漫画（創作）。一、ぱぱねこが秀長に「秀長さんを「温厚な名補佐役」と最初に書いたのは、誰でしょう？」と尋ね、秀長は「兄上の祐筆か？」。二、ぱぱねこ「いいえ。亡くなって二百年あとの、藤堂家の記録です」、秀長「二百年あと!?」。三、秀長「高虎の家か。……して、「補佐役」の名付け親は？」、ぱぱねこ「昭和の小説家です」。四、秀長がうれしそうに「わしの知らぬ間に、ずいぶん出世したのう」。二の秀長は汗をかいた困り顔、三は穏やかな顔、四は喜んだ顔。人物はみな服を着ない四つ足の猫のキャラ（ぱぱねこ）で描き、聞き手はぱぱねこ本人。秀長は折烏帽子と首の小豆で見分ける">
  <defs>
    <!-- 表情（眉なし。目と口だけを描き替える。見本は chara/papaneko-hyojo.svg）。頭の座標で重ねる -->
