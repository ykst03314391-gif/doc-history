<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人物名から探す ｜ ぱぱねこの戦国見立て</title>
  <meta name="description" content="戦国時代の武将の人物データ。生没年・家系・年表・ゆかりの地までまとめています。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Shippori+Mincho+B1:wght@700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="dev-banner"><strong>【開発中】</strong>このサイトは制作途中です。内容・デザインは随時追加・変更されます。</div>
  <header class="site-header">
    <div class="inner">
      <h1 class="site-title"><a href="index.html">ぱぱねこの戦国見立て</a></h1>
      <nav>
        <a href="index.html">トップ</a>
        <a href="articles.html">考察・記事</a>
        <a href="people.html">人物名から探す</a>
        <a href="castles.html">城から探す</a>
        <a href="regions.html">地域から探す</a>
        <a href="clans.html">大名家から探す</a>
        <a href="battles.html">合戦名から探す</a>
        <a href="topics.html">最新トピック</a>
        <a href="about.html">このサイトについて</a>
      </nav>
    </div>
  </header>

  <main>
    <h2 class="page-title">人物名から探す</h2>
    <p class="lead">「これ、誰だっけ？ どんな人だっけ？」に、出典に基づいて答えます。</p>
    <p class="lead-note muted">地域別は出身国で分け、地域（北から）の下に国を並べています。家別は家名の読みの50音順で、行（あ行・か行…）ごとに家を並べ、自分の家の項目がない家臣は仕えた家の後ろにまとめています。</p>

    <section id="recent" class="recent-updates" hidden>
      <h3 class="recent-title">最近更新した人物</h3>
      <div id="recent-list" class="recent-grid"></div>
    </section>
    <nav id="list-toc" class="side-toc" aria-label="目次" hidden></nav>
    <!-- 左端に選んでいる並べ方の名前、右端に並べ方・検索を1行に並べる（js/order.js） -->
    <div class="list-controls">
      <span id="order-current" class="order-current" aria-live="polite"></span>
      <div class="pref-picker order-picker">
        <label for="order">並べ方</label>
        <select id="order" class="pref-select">
          <option value="kana" selected>50音順</option>
          <option value="region">地域別</option>
          <option value="clan">家別</option>
        </select>
      </div>
      <input type="search" id="search" class="search-box" placeholder="名前・かな・タグで検索…">
    </div>

    <div id="list" class="card-grid" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <p>ぱぱねこの戦国見立て（開発中）／ 掲載情報には諸説あります。</p>
  </footer>

  <script src="js/order.js"></script>
  <script src="js/recent.js"></script>
  <script src="js/list.js"></script>
  <script src="js/toc.js"></script>
</body>
</html>
